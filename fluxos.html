.0,695.0]],"cross":false,"inf":false,"id":"e47"},{"f":"s40","t":"s41","label":"","pts":[[4975.0,795.0],[4997.5,795.0],[4997.5,695.0],[5020.0,695.0]],"cross":false,"inf":false,"id":"e48"},{"f":"s41","t":"s42","label":"","pts":[[5110.0,695.0],[5155.0,695.0]],"cross":false,"inf":false,"id":"e49"},{"f":"s42","t":"s43","label":"","pts":[[5245.0,695.0],[5267.5,695.0],[5267.5,240.0],[5290.0,240.0]],"cross":false,"inf":false,"id":"e50"},{"f":"s43","t":"s44","label":"","pts":[[5380.0,240.0],[5402.5,240.0],[5402.5,925.0],[5425.0,925.0]],"cross":false,"inf":false,"id":"e51"},{"f":"s44","t":"s45","label":"","pts":[[5515.0,925.0],[5560.0,925.0]],"cross":false,"inf":false,"id":"e52"},{"f":"s45","t":"s46","label":"","pts":[[5650.0,925.0],[5672.5,925.0],[5672.5,240.0],[5725.0,240.0]],"cross":false,"inf":false,"id":"e53"}],"findings":[{"sev":"alta","title":"Contrato, assinatura e bloqueio jurídico","text":"O contrato de venda nasce da pré-venda aprovada, no layout do jurídico, e o pedido fica bloqueado até a assinatura de todas as partes. Hoje a assinatura é manual (PDF por e-mail) e a intenção é integrar assinatura eletrônica. Não está definido onde o bloqueio jurídico vive (bloqueio próprio do Fertilizer ou um dos bloqueios do pedido no Protheus) nem quem o libera.","ask":"Definir o campo/estado do bloqueio jurídico, quem libera, e se a assinatura eletrônica entra nesta fase (TOTVS Assinatura ou outra) ou fica para depois.","nodes":["s11","s12","s16","s17"]},{"sev":"alta","title":"Formação de preço: a planilha semanal vira regra do sistema?","text":"O preço sai de uma planilha semanal (custo das MPs, dólar, fórmula) mais embalagem, frete e comissão, com margem autorizada pela gestão semana a semana. O ponto \"Formação de preço e custo de referência da margem\" da Venda Fábrica depende desta definição: se a planilha continua fora do sistema, a pré-venda só recebe o preço; se entra, a tabela de preço precisa dos mesmos insumos.","ask":"Decidir se a tabela de preço semanal é mantida no Fertilizer (custo da fórmula + dólar + embalagem + frete + comissão) ou importada da planilha, e como a autorização de margem (inclusive zero ou negativa) é registrada.","nodes":["s7","s8","s9","s10"]},{"sev":"alta","title":"Portal de Liberações dentro do Protheus","text":"O portal atual (MaxManager) controla a carteira: bloqueado no jurídico, pendente na logística, liberado para carregamento, e é por ele que a logística dimensiona transportadoras. A reunião pediu trazê-lo para dentro do ambiente Protheus. Na Venda Fábrica ele corresponde ao agendamento pela transportadora (etapa 16) e precisa enxergar só pedidos com crédito e jurídico liberados.","ask":"Definir os estados do portal, quem muda cada um, e se ele substitui a plataforma atual e o portal da transportadora da Mic.","nodes":["s21","s22","s23"]},{"sev":"alta","title":"Comissão: fato gerador, provisão e reversão","text":"A comissão é vinculada ao cliente, definida no pedido (padrão 1%, variando com o desconto) e tem como fato gerador o faturamento total do pedido, não o recebimento. A reunião discutiu provisionar no faturamento e reverter no pagamento, para não distorcer o mês. Falta definir o tratamento de pedidos faturados em várias notas (provisiona por nota ou só no fechamento), devolução ou cancelamento depois da provisão, e como a rotina de comissões do Protheus (apuração por nota) convive com a regra \"só quando totalmente faturado\".","ask":"Definir a regra de provisão (por nota ou no fechamento do pedido), a reversão em cancelamento e se a apuração usa a rotina padrão de comissões ou a regra da LT.","nodes":["s28","s32","s33","s44"]},{"sev":"media","title":"Adiantamento antes do pedido","text":"O RA muitas vezes chega antes da formalização do pedido, com boleto ou Pix. Com QR Code ou chave Pix no contrato a identificação fica automática. O vínculo ao pedido é padrão (MATA410 › Adiantamento) e a compensação na nota também; o que falta é o vínculo contrato → RA → pedido no Fertilizer e se o RA libera o crédito.","ask":"Definir como o RA é identificado pelo contrato e vinculado ao pedido gerado depois, e se o adiantamento dispensa a análise de crédito.","nodes":["s13","s14","s15","s19","s20"]},{"sev":"media","title":"Regras de saída no lugar do CFOP digitado","text":"Hoje o CFOP é digitado manualmente na nota. A reunião pediu regras de saída pré-configuradas (operação, TES e CFOP por tipo de venda, destino e embalagem). Isso também resolve a venda por conta e ordem e a remessa, que precisam de TES próprias.","ask":"Levantar as operações de saída existentes e montar a tabela de regras (tipo de venda × UF × embalagem → TES/CFOP).","nodes":["s26","s27"]},{"sev":"media","title":"Códigos de produto e embalagem como atributo","text":"Há vários códigos para o mesmo produto, diferindo só pela embalagem (granel, big bag). A proposta é unificar e tratar a embalagem como atributo da estrutura. Isso afeta estrutura, preço (embalagem entra no preço), estoque e a verificação de disponibilidade.","ask":"Decidir a regra de unificação e o impacto no cadastro, na tabela de preço e no histórico.","nodes":["s5","s7"]},{"sev":"media","title":"View de disponibilidade futura de MP","text":"O comercial precisa ver a expectativa de estoque de matéria-prima em datas futuras antes de prometer a entrega. É a mesma view que alimenta a verificação automática da pré-ordem (Venda Fábrica, etapa 18) e a posição comprado × vendido.","ask":"Confirmar que é uma única view (entradas em trânsito × pedidos × estrutura) e definir onde ela roda.","nodes":["s6","s23"]},{"sev":"baixa","title":"Alteração do pedido e reprogramação","text":"Data e toneladas podem mudar enquanto houver saldo a entregar e ficam bloqueadas depois da nota. A reprogramação pode trocar a matéria-prima mantendo a proporção final (ex.: 19-4-19) sem mudar preço nem contrato.","ask":"Confirmar se a troca de MP é feita na estrutura da OP ou na pré-venda, e se altera o custo apontado.","nodes":["s18","s23"]},{"sev":"baixa","title":"NFS do representante: XML ou manual","text":"O pagamento da comissão passa por pedido de compra, nota de serviço do representante (PJ), baixa do pedido, título a pagar e reversão da provisão. Se a NFS chega em XML, importa; senão, lançamento manual.","ask":"Confirmar o fluxo de compras para serviço e se a NFS municipal é importável no ambiente da AVC.","nodes":["s36","s37","s38","s40"]}],"bounds":[40,40,5870,1390],"findTab":"Pontos a definir","findTabXs":"A definir","findOne":"Ponto a definir","findTitle":"Pontos a definir","findLead":"Decisões que o quadro e o resumo da reunião deixaram em aberto. O fluxo liga o comercial (cadastros, pré-venda, contrato, adiantamento, pedido) ao carregamento da Venda Fábrica e segue pelo faturamento até a comissão do representante.","numNote":"A numeração segue a ordem do fluxo e serve só como identificador de cada etapa neste painel.","foot":"<b>Fonte:<\/b> quadro branco e resumo da reunião comercial na Uralchem (08/10/2026), confrontados com as etapas já validadas da Venda Fábrica. O bloco \"PCP\" do quadro remete à aba Venda Fábrica (pré-ordem, verificação de disponibilidade, OP, empenho, apontamento, pesagem). Etapas marcadas como requisito novo são os gaps apontados na reunião (view de disponibilidade, tabela de preço, aprovação de desconto, contrato, Portal de Liberações, provisão de comissão). Não existe diagrama de origem além do quadro: posições e traçado foram desenhados para este painel. 46 elementos e 53 conexões."},{"key":"armazenagem","name":"Armazenagem","title":"Saída para Armazenagem em Terceiros","badge":"Versão 5 · rascunho","pools":[{"key":"totvs","name":"Totvs","x":40,"y":40,"w":1085,"h":130},{"key":"lt","name":"LT Fácil","x":40,"y":220,"w":1085,"h":260},{"key":"mic","name":"Mic Sistemas","x":40,"y":530,"w":1085,"h":130}],"lanes":[{"name":"Comercial","pool":"totvs","x":90,"y":40,"w":1035,"h":130},{"name":"Fertilizantes","pool":"lt","x":90,"y":220,"w":1035,"h":130},{"name":"API integração","pool":"lt","x":90,"y":350,"w":1035,"h":130}],"nodes":[{"id":"q1","seq":1,"name":"Início","label":"Início","kind":"start","pool":"mic","poolName":"Mic Sistemas","lane":"","x":190.0,"y":580.0,"w":30,"h":30,"desc":"A operação parte da mercadoria já descarregada (Ordem de descarga, no processo de entrada).","src":["Proposta deste desenho, a validar"],"dev":false,"todo":false},{"id":"q2","seq":2,"name":"NF de entrada totalizadora (MIC)","label":"NF de entrada totalizadora (MIC)","kind":"sub","pool":"mic","poolName":"Mic Sistemas","lane":"","x":295.0,"y":565.0,"w":90,"h":60,"desc":"Nota de entrada totalizadora da MIC: a matéria-prima precisa ter entrado antes do pedido. O passo anterior a ela é a Ordem de descarga.","src":["Descrito pelo Carlos em 05/10/2026"],"dev":false,"todo":false},{"id":"q3","seq":3,"name":"Pedido de venda padrão (armazenagem em terceiros)","label":"Pedido de venda padrão (armazenagem em terceiros)","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Comercial","x":430.0,"y":75.0,"w":90,"h":60,"desc":"Pedido de venda criado no padrão do Protheus. É um processo diferente do de vendas, que nasce na pré-venda do Fertilizer.","src":["Descrito pelo Carlos em 05/10/2026"],"dev":false,"todo":false},{"id":"q4","seq":4,"name":"Liberação de crédito e estoque","label":"Liberação de crédito e estoque","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Comercial","x":565.0,"y":75.0,"w":90,"h":60,"desc":"Liberação padrão do Protheus: crédito e estoque são avaliados ao mesmo tempo.","src":["Descrito pelo Carlos em 05/10/2026"],"dev":false,"todo":false},{"id":"q5","seq":5,"name":"Ordem de carregamento de MP (automática)","label":"Ordem de carregamento de MP (automática)","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Fertilizantes","x":700.0,"y":255.0,"w":90,"h":60,"desc":"Com o pedido liberado, o Fertilizer cria a ordem de carregamento automaticamente. Não existe ordem de produção: a matéria-prima sai direto.","src":["Descrito pelo Carlos em 05/10/2026","Material de rotinas do Fertilizer, pág. 48 e 59 (ordem de carregamento)"],"dev":false,"todo":false},{"id":"q6","seq":6,"name":"Importa NF-e de saída da MIC","label":"Importa NF-e de saída da MIC","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"API integração","x":835.0,"y":385.0,"w":90,"h":60,"desc":"Importa as NF-e de saída da MIC. A nota importada consome diretamente a matéria-prima.","src":["Descrito pelo Carlos em 05/10/2026"],"dev":false,"todo":false},{"id":"q7","seq":7,"name":"Saída para armazenagem em terceiros concluída","label":"Saída para armazenagem em terceiros concluída","kind":"end","pool":"lt","poolName":"LT Fácil","lane":"API integração","x":1000.0,"y":400.0,"w":30,"h":30,"desc":"Fim da operação como foi descrita.","src":["Proposta deste desenho, a validar"],"dev":false,"todo":false}],"edges":[{"id":"e1","f":"q1","t":"q2","label":"","pts":[[220.0,595.0],[295.0,595.0]],"cross":false,"inf":false},{"id":"e2","f":"q2","t":"q3","label":"","pts":[[385.0,595.0],[407.5,595.0],[407.5,105.0],[430.0,105.0]],"cross":true,"inf":false},{"id":"e3","f":"q3","t":"q4","label":"","pts":[[520.0,105.0],[565.0,105.0]],"cross":false,"inf":false},{"id":"e4","f":"q4","t":"q5","label":"","pts":[[655.0,105.0],[677.5,105.0],[677.5,285.0],[700.0,285.0]],"cross":true,"inf":false},{"id":"e5","f":"q5","t":"q6","label":"","pts":[[790.0,285.0],[812.5,285.0],[812.5,415.0],[835.0,415.0]],"cross":false,"inf":false},{"id":"e6","f":"q6","t":"q7","label":"","pts":[[925.0,415.0],[1000.0,415.0]],"cross":false,"inf":false}],"findings":[{"sev":"alta","title":"De onde a exposição lê as vendas","text":"As vendas nascem na pré-venda do Fertilizer. A armazenagem nasce no pedido de venda padrão do Protheus. Se a posição comprado × vendido e a exposição cambial lerem os pedidos de venda do Protheus, a remessa para armazenagem em terceiros aparece como volume vendido. Lendo a partir do contrato de pré-venda, ela fica fora naturalmente.","ask":"Definir a origem do dado da exposição e confirmar que armazenage   if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pick(g.dataset.id)}
  else if(e.key==="Escape")select(null)});
$("#zIn").onclick=()=>{const [W,H]=size();zoomAt(W/2,H/2,1.35)};
$("#zOut").onclick=()=>{const [W,H]=size();zoomAt(W/2,H/2,1/1.35)};
$("#zFit").onclick=()=>fit(true);
new ResizeObserver(()=>{if(!B)return;if(fitted)fit(false);else apply()}).observe(svg);

/* ---------- minimapa ---------- */
const mini=$("#mini");
function buildMini(){mini.setAttribute("viewBox",`${B[0]-40} ${B[1]-40} ${B[2]-B[0]+80} ${B[3]-B[1]+80}`);
  mini.innerHTML=D.pools.map(p=>`<rect class="mp p-${p.key}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}"/>`).join("")+
    N.map(n=>`<rect class="mn p-${n.pool}" data-m="${n.id}" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="6"/>`).join("")+`<rect class="mv" id="mv" rx="8"/>`;
  mEl={};mini.querySelectorAll(".mn").forEach(el=>mEl[el.dataset.m]=el)}
function miniView(){const [W,H]=size(),mv=$("#mv");if(!mv)return;
  mini.style.visibility=(-view.x/view.k<=B[0]&&-view.y/view.k<=B[1]&&(W-view.x)/view.k>=B[2]&&(H-view.y)/view.k>=B[3])?"hidden":"visible";
  mv.setAttribute("x",-view.x/view.k);mv.setAttribute("y",-view.y/view.k);mv.setAttribute("width",W/view.k);mv.setAttribute("height",H/view.k)}
function miniGo(e){const pt=mini.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const w=pt.matrixTransform(mini.getScreenCTM().inverse()),[W,H]=size();
  cancelAnimationFrame(raf);view.x=W/2-w.x*view.k;view.y=H/2-w.y*view.k;fitted=false;apply()}
let md=false;
mini.addEventListener("pointerdown",e=>{md=true;try{mini.setPointerCapture(e.pointerId)}catch(_){}miniGo(e)});
mini.addEventListener("pointermove",e=>{if(md)miniGo(e)});
mini.addEventListener("pointerup",()=>md=false);mini.addEventListener("pointercancel",()=>md=false);

/* ---------- filtros ---------- */
function matches(n){
  if(st.pools.size&&!st.pools.has(n.pool))return false;
  if(st.lanes.size&&!st.lanes.has(n.lane))return false;
  if(st.kinds.size&&!st.kinds.has(n.kind))return false;
  if(st.q){const q=norm(st.q);if(!norm(n.label+" "+n.poolName+" "+n.lane+" "+KIND[n.kind]+(n.dev?" novo":"")).includes(q)&&String(n.seq)!==q.replace("#",""))return false}
  return true}
const CH={fPool:st.pools,fLane:st.lanes,fKind:st.kinds};
function chips(id,items){$("#"+id).innerHTML=items.map(it=>`<button class="chip ${it.cls||""}" data-v="${esc(it.v)}" aria-pressed="false">${it.dot?'<span class="dot"></span>':""}${esc(it.t)}<span class="c">${it.n}</span></button>`).join("")}
Object.keys(CH).forEach(id=>$("#"+id).addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const set=CH[id],v=b.dataset.v;
  set.has(v)?set.delete(v):set.add(v);b.classList.toggle("on",set.has(v));b.setAttribute("aria-pressed",set.has(v));refresh()}));
$("#q").addEventListener("input",e=>{st.q=e.target.value.trim();refresh()});
function clearF(){st.q="";$("#q").value="";[st.pools,st.lanes,st.kinds].forEach(s=>s.clear());
  document.querySelectorAll(".chip.on").forEach(c=>{c.classList.remove("on");c.setAttribute("aria-pressed","false")});refresh()}
$("#btnClear").onclick=clearF;$("#btnClear2").onclick=clearF;
$("#btnFilt").onclick=e=>{const o=$("#filters").classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",o)};

/* ---------- pintura de estado ---------- */
function paint(){
  const m=new Set(N.filter(matches).map(n=>n.id)),filtering=m.size!==N.length,t=st.tour;
  const tn=new Set(t.on?t.trail:[]),te=new Set(t.on?t.edges:[]),nb=new Set();
  if(st.sel){outE[st.sel].forEach(e=>nb.add(e.t));inE[st.sel].forEach(e=>nb.add(e.f))}
  N.forEach(n=>{const c=nodeEl[n.id].classList;c.toggle("dim",!m.has(n.id));c.toggle("sel",n.id===st.sel);c.toggle("nb",nb.has(n.id));c.toggle("trail",tn.has(n.id));
    const mc=mEl[n.id].classList;mc.toggle("dim",!m.has(n.id));mc.toggle("sel",n.id===st.sel)});
  E.forEach(e=>{const c=edgeEl[e.id].classList,h=!!st.sel&&(e.f===st.sel||e.t===st.sel),tr=te.has(e.id);
    c.toggle("dim",filtering&&!(m.has(e.f)||m.has(e.t)));c.toggle("hl",h&&!tr);c.toggle("trail",tr);
    if(h||tr)vp.insertBefore(edgeEl[e.id],nodeEl[N[0].id])});
  $("#btnClear").hidden=!filtering;
  $("#fcount").textContent=filtering?`${m.size} de ${N.length} elementos`:"";
  return m}

/* ---------- ficha da etapa ---------- */
function lk(e,dir){const o=byId[dir==="out"?e.t:e.f];
  return `<button class="lk p-${o.pool}" data-go="${o.id}"${dir==="out"?` data-edge="${e.id}"`:""}><span class="q">${o.seq}</span><span class="t">${esc(o.label)}<small>${esc(where(o))}${e.inf?" · ligação provável":""}</small></span>${e.label?`<span class="br">${esc(e.label)}</span>`:""}</button>`}
function panelDefault(){
  let rows="";const per=[];
  POOLS.forEach(p=>{const ls=D.lanes.filter(l=>l.pool===p.key),tot=N.filter(n=>n.pool===p.key).length;
    per.push({p,tot,rows:ls.length?ls.map(l=>[cap(l.name),N.filter(n=>n.lane===l.name).length]):[["Sem raias",tot]]})});
  const mx=Math.max(1,...per.flatMap(x=>x.rows.map(r=>r[1])));
  per.forEach(x=>{rows+=`<div class="bh p-${x.p.key}">${esc(x.p.name)} · ${x.tot}</div>`;
    x.rows.forEach(r=>{rows+=`<span class="bn">${esc(r[0])}</span><span class="bt p-${x.p.key}"><i style="width:${(r[1]/mx*100).toFixed(1)}%"></i></span><span class="bv">${r[1]}</span>`})});
  return `<h2>Ficha da etapa</h2><p>Clique em uma etapa do diagrama ou da lista para ver de onde ela vem e para onde vai.</p>
  <p>Use <b style="color:var(--mint)">Percorrer fluxo</b> para seguir o processo passo a passo, escolhendo o caminho em cada decisão.</p>
  <h3>Elementos por área</h3><div class="bars">${rows}</div>`}
function endMsg(n){return n.kind==="end"?"Fim do fluxo.":n.todo?"Ramo ainda não desenhado.":"Sem saída no diagrama. O caminho termina aqui."}
function renderPanel(){const b=$("#pBody");
  if(!st.sel){b.innerHTML=panelDefault();return}
  const n=byId[st.sel],o=outE[n.id],i=inE[n.id],w=findBy[n.id]||[];
  b.innerHTML=`<div class="eyebrow"><span class="pill num">Nº ${n.seq}</span><span class="pill kind">${KIND[n.kind]}</span><span class="pill p-${n.pool}">${esc(n.poolName)}</span>${n.dev?'<span class="pill dev">Requisito novo</span>':""}${n.todo?'<span class="pill dev">Pendente</span>':""}</div>
  <h2>${esc(n.label)}</h2><div class="where">${esc(where(n))}</div>
  ${n.desc?`<p class="desc">${esc(n.desc)}</p>`:""}
  ${w.map(k=>`<button class="alert" data-find="${k}"><b>${esc(D.findOne)} · ${SEV[D.findings[k].sev].toLowerCase()}</b>${esc(D.findings[k].title)}</button>`).join("")}
  <h3>Vem de</h3><div class="links">${i.length?i.map(e=>lk(e,"in")).join(""):'<span class="none">Nada. É o início do fluxo.</span>'}</div>
  <h3>${n.kind==="gw"?"Caminhos possíveis":"Vai para"}</h3><div class="links">${o.length?o.map(e=>lk(e,"out")).join(""):`<span class="none">${endMsg(n)}</span>`}</div>
  ${n.src&&n.src.length?`<h3>Origem da etapa</h3><ul class="src">${n.src.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}
  <div class="pacts"><button class="btn" data-act="center">Ver no diagrama</button>${st.tour.on?"":'<button class="btn" data-act="tour">Percorrer a partir daqui</button>'}</div>`}
$("#pBody").addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){if(st.tour.on&&g.dataset.edge&&st.tour.trail[st.tour.trail.length-1]===st.sel)advance(eById[g.dataset.edge]);else pick(g.dataset.go,true);return}
  const f=e.target.closest("[data-find]");if(f){setTab("atencao");const c=document.querySelector(`#findCards [data-f="${f.dataset.find}"]`);if(c)c.scrollIntoView({block:"center"});closeSheet();return}
  const a=e.target.closest("[data-act]");if(!a)return;
  if(a.dataset.act==="center"){setTab("diagrama");closeSheet();requestAnimationFrame(()=>centerOn(st.sel))}
  else if(a.dataset.act==="tour"){setTab("diagrama");closeSheet();startTour(st.sel)}});
function closeSheet(){$("#panel").classList.remove("open")}
$("#pClose").onclick=closeSheet;

function select(id,opt){opt=opt||{};st.sel=id;paint();renderPanel();markRows();
  if(id&&opt.center&&st.tab==="diagrama")centerOn(id);
  if(isNarrow()){if(id&&!st.tour.on&&!opt.quiet)$("#panel").classList.add("open");else if(!id)closeSheet()}}
function pick(id,center){const t=st.tour;
  if(t.on){const cur=t.trail[t.trail.length-1],e=outE[cur].find(x=>x.t===id);
    if(e){advance(e);return}
    if(id!==cur){t.trail=[id];t.edges=[]}
    select(id,{center:true});renderTour();return}
  select(id,{center:!!center})}

/* ---------- percurso ---------- */
function startTour(from){st.tour={on:true,trail:[from||N[0].id],edges:[]};$("#tourbar").hidden=false;$("#btnTour").hidden=true;
  renderTour();select(st.tour.trail[0],{quiet:true});centerOn(st.tour.trail[0])}
function advance(e){const t=st.tour;t.trail.push(e.t);t.edges.push(e.id);renderTour();select(e.t,{quiet:true});centerOn(e.t)}
function back(){const t=st.tour;if(t.trail.length<2)return;t.trail.pop();t.edges.pop();const c=t.trail[t.trail.length-1];renderTour();select(c,{quiet:true});centerOn(c)}
function endTour(quiet){st.tour={on:false,trail:[],edges:[]};$("#tourbar").hidden=true;$("#btnTour").hidden=false;if(!quiet){paint();renderPanel()}}
function renderTour(){const t=st.tour,n=byId[t.trail[t.trail.length-1]],o=outE[n.id];
  $("#tourbar").innerHTML=`<div class="tb-head"><span class="tb-step">Passo ${t.trail.length} do percurso</span><span class="tb-name">${esc(n.label)}</span><span class="tb-where">Nº ${n.seq} · ${KIND[n.kind]} · ${esc(where(n))}</span></div>
  <div class="tb-next">${o.length?o.map(e=>{const x=byId[e.t];return `<button class="nx" data-adv="${e.id}">${e.label?`<b>${esc(e.label)}</b>`:"<i>Avançar</i>"}→ ${esc(x.label)}${e.cross?` <small style="color:var(--teal)">(${esc(x.poolName)})</small>`:""}</button>`}).join(""):`<span class="end${n.kind==="end"?" ok":""}">${endMsg(n)}</span>`}</div>
  <div class="tb-ctl"><button class="btn" data-tb="back"${t.trail.length<2?" disabled":""}>Voltar</button>${isNarrow()?'<button class="btn" data-tb="info">Ficha</button>':""}<button class="btn" data-tb="restart">Reiniciar</button><button class="btn" data-tb="exit">Sair</button></div>`}
$("#tourbar").addEventListener("click",e=>{const a=e.target.closest("[data-adv]");if(a){advance(eById[a.dataset.adv]);return}
  const b=e.target.closest("[data-tb]");if(!b)return;const k=b.dataset.tb;
  if(k==="back")back();else if(k==="restart")startTour();else if(k==="exit")endTour();else if(k==="info")$("#panel").classList.add("open")});
$("#btnTour").onclick=()=>startTour();
document.addEventListener("keydown",e=>{if(!st.tour.on||st.tab!=="diagrama"||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const o=outE[st.tour.trail[st.tour.trail.length-1]];
  if(e.key==="ArrowRight"&&o.length===1){e.preventDefault();advance(o[0])}else if(e.key==="ArrowLeft"){e.preventDefault();back()}});

/* ---------- lista de etapas ---------- */
function rel(list,dir){return list.length?list.map(e=>{const o=byId[dir==="out"?e.t:e.f];return `${e.label&&dir==="out"?`<b>${esc(e.label)}</b> → `:""}${o.seq} ${esc(o.label)}`}).join("<br>"):"—"}
function renderTable(m){const rows=N.filter(n=>m.has(n.id));
  $("#tbody").innerHTML=rows.map(n=>`<tr class="row" data-id="${n.id}" tabindex="0"><td class="q">${n.seq}</td><td class="nmc">${esc(n.label)}${n.dev?' <span class="tag amber">novo</span>':""}${n.todo?' <span class="tag amber">pendente</span>':""}${warnBy[n.id]?' <span class="tag red">atenção</span>':""}</td><td><span class="tag">${KIND[n.kind]}</span></td><td><span class="sys p-${n.pool}"><i></i>${esc(where(n))}</span></td><td class="rel">${rel(inE[n.id],"in")}</td><td class="rel">${rel(outE[n.id],"out")}</td></tr>`).join("");
  $("#tblEmpty").hidden=rows.length>0;$("#tbl").hidden=!rows.length;markRows()}
function markRows(){document.querySelectorAll("#tbody tr").forEach(r=>r.classList.toggle("sel",r.dataset.id===st.sel))}
$("#tbody").addEventListener("click",e=>{const r=e.target.closest("tr.row");if(r)select(r.dataset.id)});
$("#tbody").addEventListener("keydown",e=>{const r=e.target.closest("tr.row");if(r&&e.key==="Enter")select(r.dataset.id)});

/* ---------- integrações e pontos de atenção ---------- */
function renderInteg(){const X=E.filter(e=>e.cross).sort((a,b)=>byId[a.f].seq-byId[b.f].seq),names=POOLS.map(p=>p.name);
  $("#integLead").textContent=`O fluxo passa ${X.length} vezes de um sistema para outro. São os pontos em que ${names.slice(0,-1).join(", ")} e ${names[names.length-1]} precisam trocar dados, e portanto onde ficam as integrações a construir e testar.`;
  let h=`<tr><th style="text-align:left;color:var(--muted);font-weight:normal">De ↓ · Para →</th>${POOLS.map(p=>`<th class="p-${p.key}">${esc(p.name)}</th>`).join("")}</tr>`;
  POOLS.forEach(a=>{h+=`<tr><th class="p-${a.key}" style="text-align:left">${esc(a.name)}</th>`+POOLS.map(b=>{if(a.key===b.key)return '<td class="z">·</td>';const c=X.filter(e=>byId[e.f].pool===a.key&&byId[e.t].pool===b.key).length;return `<td class="${c?"v":"z"}">${c}</td>`}).join("")+"</tr>"});
  $("#matrix").innerHTML=h+`<caption>Quantidade de passagens de cada sistema para cada outro.</caption>`;
  $("#integCards").innerHTML=X.map(e=>{const a=byId[e.f],b=byId[e.t];
    return `<div class="card"><div class="hand"><div class="side p-${a.pool}"><small>${esc(where(a))}</small><b>${a.seq} · ${esc(a.label)}</b></div><div class="arrow">↓ ${e.label?`quando <b>${esc(e.label)}</b>`:"envia para"}</div><div class="side p-${b.pool}"><small>${esc(where(b))}</small><b>${b.seq} · ${esc(b.label)}</b></div></div>
    <div class="foot"><button class="btn" data-show="${a.id}">Ver no diagrama</button>${e.inf?'<span class="tag red">ligação a confirmar</span>':""}</div></div>`}).join("")}
function renderFind(){$("#findTitle").textContent=D.findTitle;$("#findLead").textContent=D.findLead;
  $("#findCards").innerHTML=D.findings.map((f,i)=>`<div class="card find s-${f.sev}" data-f="${i}"><span class="sev">${SEV[f.sev]}</span><h3>${esc(f.title)}</h3><p>${esc(f.text)}</p><div class="ask"><b>O que decidir</b>${esc(f.ask)}</div>${f.nodes.length?`<div class="nchips">${f.nodes.map(id=>`<button class="nchip" data-show="${id}"><span>${byId[id].seq}</span>${esc(byId[id].label)}</button>`).join("")}</div>`:""}</div>`).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-show]");if(!b)return;const id=b.dataset.show;
  if(st.tour.on)endTour();setTab("diagrama");select(id,{quiet:true});requestAnimationFrame(()=>{centerOn(id);$("#canvas").scrollIntoView({block:"nearest"})})});

/* ---------- abas e fluxos ---------- */
function setHash(){try{history.replaceState(null,"","#"+st.flow+"-"+st.tab)}catch(_){}}
function setTab(t,silent){if(!TABS.includes(t))t="diagrama";st.tab=t;
  TABS.forEach(k=>{$("#s-"+k).hidden=k!==t;$("#t-"+k).setAttribute("aria-selected",k===t)});
  const two=t==="diagrama"||t==="etapas";$("#filters").hidden=!two;$("#panel").hidden=!two;$("#work").classList.toggle("solo",!two);
  if(!two)closeSheet();
  if(t==="diagrama")requestAnimationFrame(()=>{if(fitted)fit(false);else apply()});
  if(!silent)setHash()}
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)setTab(b.dataset.tab)});
function refresh(){renderTable(paint())}

function load(key,silent){
  D=FLOWS.find(f=>f.key===key)||FLOWS[0];st.flow=D.key;N=D.nodes;E=D.edges;B=D.bounds;
  byId={};outE={};inE={};eById={};warnBy={};findBy={};
  N.forEach(n=>{byId[n.id]=n;outE[n.id]=[];inE[n.id]=[]});
  E.forEach(e=>{eById[e.id]=e;outE[e.f].push(e);inE[e.t].push(e)});
  D.findings.forEach((f,i)=>f.nodes.forEach(id=>{(findBy[id]=findBy[id]||[]).push(i);if(f.sev!=="baixa")(warnBy[id]=warnBy[id]||[]).push(i)}));
  POOLS=D.pools.map(p=>({key:p.key,name:p.name}));
  st.sel=null;st.q="";$("#q").value="";[st.pools,st.lanes,st.kinds].forEach(s=>s.clear());endTour(true);closeSheet();
  document.querySelectorAll("#seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.flow===D.key));
  $("#flowTitle").textContent=D.title;const bd=$("#flowBadge");bd.hidden=!D.badge;bd.textContent=D.badge||"";
  svg.setAttribute("aria-label","Diagrama: "+D.title+" ("+POOLS.map(p=>p.name).join(", ")+")");
  const nCross=E.filter(e=>e.cross).length,nInf=E.filter(e=>e.inf).length,nDev=N.filter(n=>n.dev).length;
  $("#kpis").innerHTML=[
    [cnt("task")+cnt("sub"),"Atividades",cnt("task")+" tarefas · "+cnt("sub")+" subprocessos"],
    [cnt("gw"),"Decisões",""],
    [E.length,"Conexões",nInf?nInf+" sem destino ligado":""],
    [POOLS.length,"Sistemas",D.lanes.length+" raias"],
    [nCross,"Trocas","entre sistemas"]
  ].map(k=>`<div class="kpi"><div class="v">${k[0]}</div><div class="l">${k[1]}${k[2]?`<small>${k[2]}</small>`:""}</div></div>`).join("");
  $("#nEtapas").textContent=N.length;$("#nInteg").textContent=nCross;$("#nFind").textContent=D.findings.length;
  $("#findTabLg").textContent=D.findTab;$("#findTabXs").textContent=D.findTabXs;
  $("#numNote").textContent=D.numNote;$("#foot").innerHTML=D.foot;
  $("#lgEnd").hidden=!cnt("end");$("#lgInf").hidden=!nInf;$("#lgDev").hidden=!nDev;$("#lgTodo").hidden=!N.some(n=>n.todo);
  chips("fPool",POOLS.map(p=>({v:p.key,t:p.name,n:N.filter(n=>n.pool===p.key).length,cls:"p-"+p.key,dot:1})));
  chips("fLane",D.lanes.map(l=>({v:l.name,t:cap(l.name),n:N.filter(n=>n.lane===l.name).length,cls:"p-"+l.pool,dot:1})));
  chips("fKind",["task","sub","gw"].map(k=>({v:k,t:KIND[k],n:cnt(k)})));
  build();buildMini();renderInteg();renderFind();renderPanel();refresh();
  fitted=true;fit(false);if(!silent)setHash()}

$("#seg").innerHTML=FLOWS.map(f=>`<button role="tab" data-flow="${f.key}" aria-selected="false">${esc(f.name)}</button>`).join("");
$("#seg").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.dataset.flow!==st.flow)load(b.dataset.flow)});
const h0=(location.hash||"").slice(1),f0=FLOWS.find(f=>h0===f.key||h0.startsWith(f.key+"-"));
load(f0?f0.key:FLOWS[0].key,true);setTab(f0?h0.slice(f0.key.length+1):h0,true);
})();
</script>

</body>
</html>
