<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fluxos de Processo LT</title>
<style>
/* Layout: faixa de marca com seletor de fluxo + abas; área de trabalho em duas colunas (diagrama navegável | ficha da etapa). No celular a ficha vira folha inferior. */
:root{
  color-scheme:dark;
  --navy:#0A1024;--bg:#0A1024;--slate2:#1B2135;--slate:#2A3142;--gray:#4A5165;--muted:#9AA3B8;--white:#FFFFFF;--text:#FFFFFF;
  --mint:#1ED69E;--teal:#19D1AF;--amber:#FFC000;--red:#E05C5C;--blue:#7FB2F0;
  --line:rgba(30,214,158,.15);--edge:#6B7591;--lane-a:rgba(255,255,255,.022);--lane-b:rgba(255,255,255,.05);
  --font:Arial,Helvetica,sans-serif;--mono:"JetBrains Mono","SFMono-Regular",Consolas,"Courier New",monospace;
  --r:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;
  background-image:radial-gradient(900px 500px at 100% 0%,rgba(25,209,175,.10),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(25,209,175,.06),transparent 60%);
  background-attachment:fixed;min-height:100%}
button{font:inherit;color:inherit}
.wrap{padding-inline:20px;padding-block:0 28px;max-width:1680px;margin:0 auto}
@media (max-width:640px){.wrap{padding-inline:16px}}
.mono{font-family:var(--mono)}
.p-totvs{--pc:var(--blue)}.p-lt{--pc:var(--mint)}.p-mic{--pc:var(--amber)}

/* cabeçalho */
header.top{display:flex;align-items:center;gap:16px 24px;padding-block:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:48px;width:auto;flex:none}
.brand h1{margin:0;font-size:12px;font-weight:normal;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;border-left:1px solid var(--slate);padding-left:14px;text-wrap:balance}
.brand h1 b{display:block;color:var(--white);font-size:17px;letter-spacing:.02em;text-transform:none;margin-top:2px}
.flowsel{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;max-width:100%}
.seg{display:inline-flex;background:var(--slate2);border:1px solid var(--slate);border-radius:999px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;flex:none}
.seg button{background:none;border:0;color:var(--muted);padding:7px 16px;border-radius:999px;cursor:pointer;font-size:13px}
.seg button:hover{color:var(--white)}
.seg button[aria-selected="true"]{background:var(--mint);color:var(--navy);font-weight:bold}
.vbadge{font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:999px;padding:3px 10px;white-space:nowrap}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.kpi{background:var(--slate2);border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;min-width:92px}
.kpi .v{font-family:var(--mono);font-size:20px;color:var(--mint);font-weight:bold;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--muted)}
.kpi .l small{display:block;font-size:10px;opacity:.85}

/* abas */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--slate);margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:10px 14px;cursor:pointer;white-space:nowrap;font-size:14px}
.tab:hover{color:var(--white)}
.tab[aria-selected="true"]{color:var(--mint);border-bottom-color:var(--mint)}
.tab .xs{display:none}
.tab .n{font-family:var(--mono);font-size:11px;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--slate);color:var(--muted);font-weight:normal}
.tab .n.warn{background:rgba(224,92,92,.2);color:var(--red)}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}

/* filtros */
.filters{display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap;padding-block:12px}
.filters .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filters .lbl{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
input[type=search]{background:var(--slate2);border:1px solid var(--slate);color:var(--white);padding:8px 10px;border-radius:8px;font:inherit;outline:none;width:220px;max-width:100%}
input[type=search]:focus{border-color:var(--mint)}
.chip{border:1px solid var(--slate);background:transparent;color:var(--muted);padding:5px 10px;border-radius:999px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{color:var(--white)}
.chip .dot{width:8px;height:8px;border-radius:2px;background:var(--pc,var(--muted));flex:none}
.chip .c{font-family:var(--mono);font-size:11px;opacity:.8}
.chip.on{border-color:var(--pc,var(--mint));color:var(--white);background:rgba(255,255,255,.07)}
.btn{background:transparent;border:1px solid var(--slate);color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;white-space:nowrap}
.btn:hover{border-color:var(--mint);color:var(--mint)}
.btn.primary{background:var(--mint);color:var(--navy);border-color:var(--mint);font-weight:bold}
.btn.primary:hover{color:var(--navy);filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:default;pointer-events:none}
.fcount{font-size:12px;color:var(--muted)}
#btnFilt{display:none}
@media (max-width:760px){
  #btnFilt{display:inline-flex}
  .filters .grp.more{display:none}
  .filters.open .grp.more{display:flex;width:100%}
  input[type=search]{flex:1;width:auto;min-width:0}
  .fcount{width:100%;margin:0}
}

/* área de trabalho */
.work{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.work.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.work{grid-template-columns:minmax(0,1fr)}}
.canvas{position:relative;height:clamp(440px,calc(100vh - 250px),820px);border:1px solid var(--line);border-radius:12px;background:rgba(27,33,53,.45);overflow:hidden}
@media (max-width:640px){.canvas{height:clamp(440px,76vh,700px)}}
#dia{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#dia.drag{cursor:grabbing}
.ovl{position:absolute;display:flex;gap:6px;align-items:flex-start}
.ovl.tl{top:10px;left:10px}
.ovl.tr{top:10px;right:10px;flex-direction:column;align-items:flex-end}
.zoom{display:flex;gap:4px}
.zoom .btn,.ovl .btn{background:rgba(10,16,36,.86);backdrop-filter:blur(4px)}
.ovl .btn.primary{background:var(--mint)}
.zoom .btn{min-width:34px;padding:7px 9px;font-family:var(--mono)}
#mini{width:176px;height:138px;border:1px solid var(--slate);border-radius:8px;background:rgba(10,16,36,.9);cursor:pointer;touch-action:none;display:block}
@media (max-width:640px){#mini{display:none}}
#mini .mp{fill:var(--pc);fill-opacity:.1;stroke:var(--pc);stroke-opacity:.5;stroke-width:6}
#mini .mn{fill:var(--pc)}
#mini .mn.dim{fill-opacity:.2}
#mini .mn.sel{fill:var(--white)}
#mini .mv{fill:rgba(255,255,255,.1);stroke:var(--white);stroke-width:10}

/* diagrama */
#dia text{font-family:var(--font);fill:var(--white)}
.pool-bg{fill:var(--pc);fill-opacity:.035;stroke:var(--pc);stroke-opacity:.45;stroke-width:1.5}
.pool-hd{fill:var(--pc);fill-opacity:.16}
#dia text.pool-t{fill:var(--pc);font-size:24px;font-weight:bold;letter-spacing:.06em}
.lane{stroke:rgba(255,255,255,.09);stroke-width:1}
.lane.a{fill:var(--lane-a)}.lane.b{fill:var(--lane-b)}
.lane.hl{fill:url(#hatch);stroke:rgba(127,178,240,.45);stroke-dasharray:6 4}
#dia text.lane-t.hl{fill:var(--blue)}
#dia text.lane-note{fill:var(--blue);font-size:11px;font-style:italic;opacity:.85}
#dia text.lane-t{fill:var(--muted);font-size:17px;font-weight:bold;letter-spacing:.05em}
.eg path{fill:none;stroke:var(--edge);stroke-width:1.5;marker-end:url(#ar)}
#dia .eg text{font-size:10px;fill:var(--amber);font-weight:bold;paint-order:stroke;stroke:var(--navy);stroke-width:3.5px;stroke-linejoin:round}
.eg.cross path{stroke:var(--teal);stroke-dasharray:7 4;marker-end:url(#ar-cross)}
.eg.inf path{stroke:var(--red);stroke-dasharray:3 4;stroke-width:2;marker-end:url(#ar-inf)}
.eg.hl path{stroke:var(--white);stroke-width:2.4;marker-end:url(#ar-hl)}
.eg.inf.hl path{stroke:var(--red);stroke-width:2.8;marker-end:url(#ar-inf)}
.eg.trail path{stroke:var(--mint);stroke-width:3.2;stroke-dasharray:none;marker-end:url(#ar-trail)}
.eg.dim{opacity:.16}
.mk{fill:var(--edge)}.mk.cross{fill:var(--teal)}.mk.inf{fill:var(--red)}.mk.hl{fill:var(--white)}.mk.trail{fill:var(--mint)}
.node{cursor:pointer;outline:none}
.node .shape{fill:var(--slate2);stroke:var(--pc);stroke-width:1.6}
.node.k-gw .shape{fill:#232a40}
.node.k-start .shape{fill:rgba(30,214,158,.18);stroke:var(--mint);stroke-width:2.2}
.node.k-end .shape{stroke-width:4}
.node.todo .shape{stroke-dasharray:5 4;fill:rgba(27,33,53,.5)}
#dia .node .devt{font-size:6.5px;font-weight:bold;fill:var(--amber);letter-spacing:.04em;pointer-events:none}
.node .nm{font-size:9px;text-anchor:middle;pointer-events:none}
.node .gl{font-size:9.5px;paint-order:stroke;stroke:var(--navy);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
#dia .node .num{font-family:var(--mono);font-size:7.5px;fill:var(--pc);pointer-events:none}
#dia .node .num.c{text-anchor:middle;font-size:9px;font-weight:bold}
.node .plus{fill:none;stroke:var(--pc);stroke-width:1}
.node:hover .shape{fill:#2a3555}
.node:focus-visible .shape{stroke:var(--white);stroke-width:3}
.node.nb .shape{stroke-width:2.6}
.node.trail .shape{fill:rgba(30,214,158,.24);stroke:var(--mint);stroke-width:2.2}
.node.sel .shape{stroke:var(--white);stroke-width:3.2;fill:#2f3d66}
.node.dim{opacity:.17}
.node.warn .wdot{display:block}
.wdot{display:none;fill:var(--red);stroke:var(--navy);stroke-width:1.5}

/* barra do percurso */
.tourbar{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(10,16,36,.95);border:1px solid var(--mint);border-radius:12px;padding:10px 12px;display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.tb-head{min-width:0;flex:1 1 220px}
.tb-step{font-size:11px;color:var(--mint);letter-spacing:.1em;text-transform:uppercase;display:block}
.tb-name{font-weight:bold;font-size:15px;display:block;overflow-wrap:anywhere}
.tb-where{font-size:12px;color:var(--muted)}
.tb-next{display:flex;gap:6px;flex-wrap:wrap;flex:2 1 260px}
.tb-next .end{font-size:12px;color:var(--red)}
.tb-next .end.ok{color:var(--mint)}
.tb-ctl{display:flex;gap:6px}
.nx{background:rgba(30,214,158,.12);border:1px solid var(--mint);color:var(--white);padding:7px 11px;border-radius:8px;cursor:pointer;font-size:13px;text-align:left;max-width:100%}
.nx:hover{background:rgba(30,214,158,.24)}
.nx b{color:var(--amber);margin-right:4px}
.nx i{font-style:normal;color:var(--mint);margin-right:4px}

/* legenda */
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;padding:10px 2px 0;color:var(--muted);font-size:12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{flex:none}

/* ficha */
.panel{background:var(--slate2);border:1px solid var(--line);border-radius:12px;padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;min-width:0}
.panel h2{margin:0 0 4px;font-size:19px;line-height:1.25;overflow-wrap:anywhere;text-wrap:balance}
.panel .eyebrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.panel .where{color:var(--muted);font-size:13px;margin-bottom:12px}
.panel h3{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:normal;margin:16px 0 6px}
.panel p{margin:0 0 8px;color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--pc,var(--slate));color:var(--pc,var(--muted));white-space:nowrap}
.pill.kind{border-color:var(--slate);color:var(--white);background:var(--slate)}
.pill.dev{border-color:var(--amber);color:var(--amber)}
.panel p.desc{color:var(--white);font-size:13.5px;margin:0 0 4px}
.src{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px}
.src li{margin:2px 0}
.pill.num{font-family:var(--mono);border-color:transparent;background:rgba(255,255,255,.08);color:var(--white)}
.links{display:flex;flex-direction:column;gap:6px}
.lk{display:flex;gap:8px;align-items:baseline;background:var(--navy);border:1px solid var(--slate);border-left:3px solid var(--pc);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;width:100%;font-size:13px}
.lk:hover{border-color:var(--mint);border-left-color:var(--pc)}
.lk .q{font-family:var(--mono);font-size:11px;color:var(--muted);flex:none}
.lk .t{min-width:0;overflow-wrap:anywhere;flex:1}
.lk .t small{display:block;color:var(--muted);font-size:11px}
.lk .br{color:var(--amber);font-weight:bold;font-size:12px;flex:none}
.none{color:var(--muted);font-size:13px;font-style:italic}
.alert{border:1px solid rgba(224,92,92,.5);background:rgba(224,92,92,.1);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-top:6px;cursor:pointer;display:block;width:100%;text-align:left}
.alert b{color:var(--red);display:block;margin-bottom:2px}
.pacts{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.close{display:none;position:absolute;top:10px;right:10px;background:none;border:1px solid var(--slate);color:var(--muted);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px}
.bars .bn{color:var(--white);white-space:nowrap}
.bars .bt{height:10px;border-radius:3px;background:rgba(255,255,255,.06);overflow:hidden}
.bars .bt i{display:block;height:100%;background:var(--pc);border-radius:3px}
.bars .bv{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.bars .bh{grid-column:1/-1;font-size:11px;color:var(--pc);letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
@media (max-width:980px){
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;border-radius:16px 16px 0 0;max-height:72vh;transform:translateY(105%);transition:transform .25s;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.6);border-color:var(--mint)}
  .panel.open{transform:none}
  .panel h2{padding-right:40px}
  .close{display:block}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
@media (max-width:640px){
  .logo{height:40px}
  .flowsel{width:100%}
  .seg button{padding:7px 11px;font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%;margin:0}
  .kpi{min-width:0;padding:6px 7px}
  .kpi .v{font-size:17px}
  .kpi .l{font-size:10px}
  .kpi .l small{display:none}
  .tab{padding:10px 7px;font-size:13px}
  .tab .lg{display:none}.tab .xs{display:inline}
  .tab .n{margin-left:3px;padding:1px 5px}
  .tourbar{left:6px;right:6px;bottom:6px;padding:8px 10px;gap:6px 10px}
  .tb-head{flex-basis:100%}
  .tb-name{font-size:14px}
  .tb-next{flex-basis:100%}
  .nx{padding:6px 9px}
  .tb-ctl .btn{padding:6px 9px}
}

/* tabelas e cartões */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:rgba(27,33,53,.5)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:normal;padding:10px 12px;border-bottom:1px solid var(--slate);white-space:nowrap;letter-spacing:.06em;text-transform:uppercase}
td{padding:9px 12px;border-bottom:1px solid rgba(42,49,66,.6);vertical-align:top;font-size:13px}
tr.row{cursor:pointer}
tr.row:hover td{background:rgba(30,214,158,.05)}
tr.row.sel td{background:rgba(30,214,158,.11)}
td.q{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
td.nmc{font-weight:bold;min-width:180px}
td.rel{color:var(--muted);font-size:12px;min-width:170px}
td.rel b{color:var(--amber);font-weight:bold}
td .sys{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
td .sys i{width:8px;height:8px;border-radius:2px;background:var(--pc);flex:none}
.note{color:var(--muted);font-size:12px;margin:10px 2px 0;max-width:80ch}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  #tbl thead{display:none}
  #tbl,#tbl tbody{display:block}
  #tbl tr.row{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 12px;border-bottom:1px solid rgba(42,49,66,.6)}
  #tbl td{border:0;padding:0;background:none!important}
  #tbl td.q{grid-row:1/4}
  #tbl td.nmc{min-width:0}
  #tbl td.rel{display:none}
}
.sec{padding-top:16px}
.sec h2{font-size:18px;margin:0 0 4px}
.sec .lead{color:var(--muted);margin:0 0 14px;max-width:75ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.card{background:var(--slate2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hand{display:grid;grid-template-columns:1fr;gap:6px}
.hand .side{border-left:3px solid var(--pc);padding:2px 0 2px 10px;min-width:0}
.hand .side small{display:block;color:var(--pc);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.hand .side b{overflow-wrap:anywhere}
.hand .arrow{color:var(--muted);font-size:12px;padding-left:13px}
.hand .arrow b{color:var(--amber)}
.card .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto}
.tag{font-size:11px;padding:2px 8px;border-radius:5px;background:var(--slate);color:var(--muted);white-space:nowrap}
.tag.red{background:rgba(224,92,92,.18);color:var(--red)}
.tag.amber{background:rgba(255,192,0,.15);color:var(--amber)}
.lgnovo{font-size:10px;color:var(--amber);letter-spacing:.04em}
.matrix{border-collapse:separate;border-spacing:4px;width:auto;margin-bottom:18px}
.matrix th,.matrix td{border:0;padding:8px 12px;text-align:center;font-size:13px;text-transform:none;letter-spacing:0}
.matrix th{color:var(--pc,var(--muted));font-weight:bold}
.matrix td{background:var(--slate2);border-radius:6px;font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:74px}
.matrix td.z{color:var(--gray)}
.matrix td.v{color:var(--mint);font-weight:bold;font-size:16px}
.matrix caption{caption-side:bottom;text-align:left;color:var(--muted);font-size:12px;padding-top:4px}
.flist{display:flex;flex-direction:column;gap:12px;max-width:920px}
.find{border-left:4px solid var(--sc)}
.find.s-alta{--sc:var(--red)}.find.s-media{--sc:var(--amber)}.find.s-baixa{--sc:var(--gray)}
.find h3{margin:0;font-size:15px;line-height:1.3;text-wrap:balance}
.find p{margin:0;color:var(--muted);font-size:13px}
.find .ask{color:var(--white);font-size:13px}
.find .ask b{color:var(--mint);font-weight:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:block}
.sev{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--sc);color:var(--sc);letter-spacing:.06em;text-transform:uppercase;align-self:flex-start}
.find.s-baixa .sev{color:var(--muted)}

:false,"inf":false},{"id":"e64","f":"n42","t":"n44","label":"Não","pts":[[2361.0,2246.0],[2417.0,2246.0],[2417.0,436.0],[2472.0,436.0]],"cross":true,"inf":false},{"id":"e65","f":"n43","t":"n45","label":"","pts":[[2386.0,2350.0],[2620.0,2350.0],[2620.0,1558.0]],"cross":true,"inf":false}],"findings":[{"sev":"alta","title":"Conector sem destino em \"Ordem de descarga\"","text":"O conector que sai de \"Ordem de descarga\" (LT Fácil) não está ligado a nenhum elemento, nem no arquivo Bizagi nem no Visio. A ponta termina 6 px abaixo de \"Pré Nota Filha\" (Totvs · Compras), então este painel o trata como ligação provável e o desenha em vermelho tracejado.","ask":"Confirmar com o autor se a Ordem de descarga dispara a Pré Nota Filha.","nodes":["n45","n46"]},{"sev":"alta","title":"Quantidade de entrada: nota ou balança","text":"O diagrama dá entrada pela quantidade da NF Filha. Na reunião na Uralchem decidiu-se que a entrada deve ser pela balança, para medir a perda no transporte, que hoje ninguém dimensiona; a balança do porto não é confiável e pode gerar 100–200 t de diferença por navio. A regra ficou pela metade: \"a pesagem aqui não pode ser menor que a de lá\" e \"a nota é de 20, a balança deu 19,8\". Com 700–800 caminhões por navio a diferença acumulada é relevante.","ask":"Definir tolerância por produto, quem aprova a diferença, qual quantidade grava a entrada e quando se emite NF de quebra. Vale também para a Uralchem Paraná, que usará o mesmo sistema.","nodes":["n45","n46","n47"]},{"sev":"alta","title":"Preço não cravado: o caminho para e não volta","text":"Em \"Possui preço cravado?\", o ramo \"não\" leva a \"Schedulle de atualização de custos Semanal\" e termina ali. Só o ramo \"Sim\" chega ao Desembaraço. Pelo desenho, uma importação sem preço cravado nunca é desembaraçada.","ask":"Definir como o processo retoma depois que o preço é fixado (retorno para \"atualiza invoice\"?).","nodes":["n20","n25"]},{"sev":"alta","title":"Três decisões com uma única saída","text":"\"Existe despesas provisionadas\" só tem o ramo \"Sim\". \"Possui triangulação?\" e \"Integra dados DI com MIC?\" têm uma saída cada, sem rótulo. Falta o caminho alternativo: sem despesas provisionadas, por exemplo, o fluxo não alcança \"Retorno de finalização de entradas\".","ask":"Desenhar o ramo \"Não\" de cada decisão e rotular as saídas.","nodes":["n53","n58","n40"]},{"sev":"media","title":"Reprovação na alçada não tem saída","text":"\"Aprovado?\" com resposta \"Não\" volta para \"Controle de alçadas\". Não existe caminho de reprovação definitiva ou cancelamento do pedido, então o desenho admite um laço sem fim.","ask":"Incluir o desfecho de pedido reprovado.","nodes":["n11","n10"]},{"sev":"media","title":"Fluxo sem evento de fim","text":"Há um evento de início e nenhum de fim. Dois elementos ficam sem saída: \"Gera Ordem de Remessa\" (o fim natural do processo) e \"Schedulle de atualização de custos Semanal\".","ask":"Marcar explicitamente onde o processo termina.","nodes":["n59","n25"]},{"sev":"media","title":"Raia \"API integração\" está vazia","text":"A raia \"API integração\" da LT Fácil não contém nenhum elemento. Os dez elementos da LT Fácil estão na raia \"Fertilizantes\", inclusive os que trocam dados com Totvs e Mic Sistemas.","ask":"Mover as etapas de integração para a raia própria ou remover a raia.","nodes":["n40","n57"]},{"sev":"baixa","title":"Trocas entre sistemas desenhadas como fluxo de sequência","text":"As oito passagens entre Totvs, LT Fácil e Mic Sistemas usam conector de sequência. Na notação BPMN, comunicação entre piscinas é fluxo de mensagem. Não muda a leitura, mas importa se o diagrama for usado como especificação de integração.","ask":"Trocar por fluxos de mensagem na próxima revisão.","nodes":[]},{"sev":"baixa","title":"Nomes repetidos em etapas diferentes","text":"\"Contábilização do estoque em transito\" aparece 4 vezes, \"Título INV\" 3 vezes e \"Movimento interno Armazem 81\" 2 vezes. A numeração deste painel distingue cada ocorrência, mas no original elas se confundem.","ask":"Diferenciar pelo evento que as dispara (Invoice, atualização de invoice, DI, NF).","nodes":["n16","n22","n28","n17","n23","n29","n34","n18","n24"]},{"sev":"baixa","title":"Grafia a revisar antes de apresentar","text":"Os nomes foram mantidos como estão no arquivo: \"Schedulle\", \"NF FIlha\", \"préCalculo\", \"Contabilização estoque provisiona\" (cortado), \"transito\" sem acento.","ask":"Corrigir no Bizagi e exportar de novo.","nodes":["n25","n44","n13","n55"]}],"bounds":[449.0,40.0,3474.0,2419.0],"key":"importacao","name":"Importação","title":"Fluxo de Importação","badge":"","findTab":"Pontos de atenção","findTabXs":"Atenção","findOne":"Ponto de atenção","findTitle":"Pontos de atenção no desenho","findLead":"Achados da leitura dos arquivos. Descrevem lacunas do diagrama, que podem ou não refletir lacunas do processo real. Vale validar com quem modelou antes de usar o fluxo como especificação.","numNote":"A numeração foi atribuída por este painel seguindo a ordem do fluxo, para dar um identificador único a cada elemento. Ela não existe no arquivo original.","foot":"<b>Fonte:<\/b> “Fluxo Importação.bpm” (Bizagi Modeler 4.3.0.008, autor CaioFonseca, criado em 30/09/2026 e alterado em 05/10/2026) e “Fluxo Importação.vdx” (exportação Visio do mesmo diagrama). Os dois arquivos foram lidos e comparados: contêm o mesmo fluxo, com 59 elementos (1 início, 14 tarefas, 33 subprocessos e 11 decisões), 65 conexões, 3 piscinas e 8 raias. Posições e traçados seguem as coordenadas do Bizagi. Nomes mantidos como no original."},{"key":"venda-costado","name":"Venda Costado","title":"Venda no Costado","badge":"Versão 6 · rascunho","pools":[{"key":"totvs","name":"Totvs","x":40,"y":40,"w":3600,"h":750},{"key":"lt","name":"LT Fácil","x":40,"y":840,"w":3600,"h":480},{"key":"mic","name":"Mic Sistemas","x":40,"y":1370,"w":3600,"h":140}],"lanes":[{"name":"Comercial","pool":"totvs","x":90,"y":40,"w":3550,"h":130},{"name":"Financeiro","pool":"totvs","x":90,"y":170,"w":3550,"h":230},{"name":"Estoque e produção","pool":"totvs","x":90,"y":400,"w":3550,"h":130},{"name":"Fiscal","pool":"totvs","x":90,"y":530,"w":3550,"h":130},{"name":"Contábil","pool":"totvs","x":90,"y":660,"w":3550,"h":130},{"name":"Painel de Vendas","pool":"lt","x":90,"y":840,"w":3550,"h":130},{"name":"Lotes e exposição","pool":"lt","x":90,"y":970,"w":3550,"h":220},{"name":"Carga e integração","pool":"lt","x":90,"y":1190,"w":3550,"h":130}],"nodes":[{"id":"s1","seq":1,"name":"Negociação da venda","label":"Negociação da venda","kind":"start","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":190.0,"y":890.0,"w":30,"h":30,"desc":"O executivo comercial negocia a venda com o cliente.","src":["Descrito pelo Carlos em 05/10/2026"],"dev":false,"todo":false},{"id":"s2","seq":2,"name":"Pré-venda (contrato)","label":"Pré-venda (contrato)","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":295.0,"y":875.0,"w":90,"h":60,"desc":"Registro da negociação: cliente, produto, quantidade, preço, regra de saída, frete, vencimento, moeda e PTAX. A moeda precisa ser obrigatória, porque alimenta a exposição cambial diária. Complemento de 07/10/2026: o contrato precisa identificar se a venda é por conta e ordem (o cliente compra e a entrega é em outro lugar), com o destinatário da remessa, porque isso define a nota adicional no fim do fluxo.","src":["Material de rotinas do Fertilizer, pág. 35–37","Descrito pelo Carlos em 05/10/2026 (moeda)","Definido pelo Carlos em 07/10/2026 (conta e ordem)"],"dev":false,"todo":false},{"id":"s3","seq":3,"name":"Agrega lote disponível (FIFO)","label":"Agrega lote disponível (FIFO)","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":430.0,"y":1005.0,"w":90,"h":60,"desc":"O Fertilizer vincula à venda o lote mais antigo com saldo disponível do material, antes da validação de margem. O controle de estoque é FIFO e o pedido herda esse lote. Em 07/10/2026 o Carlos colocou esta etapa como ponto a definir: a reunião mostrou que o lote de entrada some na OP e o físico mistura navios, então ainda não está decidido se a venda agrega lote, com que finalidade (reserva de exposição e custo, ou rastreio) e em que momento.","src":["Descrito pelo Carlos em 05/10/2026","Definido pelo Carlos em 07/10/2026"],"dev":true,"todo":true},{"id":"s4","seq":4,"name":"Há lote com saldo?","label":"Há lote com saldo?","kind":"gw","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":590.0,"y":1015.0,"w":40,"h":40,"desc":"Verifica se existe lote com saldo para cobrir a quantidade vendida. Depende da definição da etapa anterior.","src":["Proposta deste desenho, a validar"],"dev":true,"todo":true},{"id":"s5","seq":5,"name":"Venda sem lote (a descoberto)","label":"Venda sem lote (a descoberto)","kind":"task","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":700.0,"y":1105.0,"w":90,"h":60,"desc":"Sem lote disponível, a venda segue sem vínculo e aparece na posição como vendida sem cobertura, até existir lote. Depende da definição de \"Agrega lote\".","src":["Proposta deste desenho, a validar"],"dev":true,"todo":true},{"id":"s6","seq":6,"name":"Validação de margem","label":"Validação de margem","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":835.0,"y":875.0,"w":90,"h":60,"desc":"Calcula a margem do contrato (venda e custo total em USD, frete, PTAX) e envia aos aprovadores. Em 07/10/2026 o Carlos marcou esta etapa como gap: ainda não está definido como o preço será formado nem qual custo de referência valida a margem desse preço. Até lá a etapa fica pendente.","src":["Material de rotinas do Fertilizer, pág. 26","Descrito pelo Carlos em 05/10/2026 (depois do lote)","Definido pelo Carlos em 07/10/2026"],"dev":false,"todo":true},{"id":"s7","seq":7,"name":"Contrato aprovado?","label":"Contrato aprovado?","kind":"gw","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":995.0,"y":885.0,"w":40,"h":40,"desc":"Aprovação do contrato e do frete pelos aprovadores, na aba Contratos Pendentes. A reunião confirmou que a pré-venda concentra os bloqueios comerciais e jurídicos (contrato assinado, condição de pagamento): o pedido de venda só nasce depois dela.","src":["Material de rotinas do Fertilizer, pág. 21 e 24","Reunião na Uralchem (transcrição e quadro), analisada em 07/10/2026"],"dev":false,"todo":false},{"id":"s8","seq":8,"name":"Pedido de venda","label":"Pedido de venda","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Comercial","x":1105.0,"y":75.0,"w":90,"h":60,"desc":"O executivo comercial inclui o pedido de venda a partir do contrato aprovado, com o lote já vinculado. É a inclusão do pedido que coloca a venda nas análises de exposição, então ela precisa acontecer no ato da venda.","src":["Descrito pelo Carlos em 05/10/2026","Material de rotinas do Fertilizer, pág. 22"],"dev":false,"todo":false},{"id":"s9","seq":9,"name":"Venda não efetivada","label":"Venda não efetivada","kind":"end","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":1135.0,"y":890.0,"w":30,"h":30,"desc":"Contrato rejeitado. Não gera pedido nem entra na posição vendida.","src":["Proposta deste desenho, a validar"],"dev":false,"todo":false},{"id":"s10","seq":10,"name":"Posição comprado × vendido","label":"Posição comprado × vendido","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":1240.0,"y":1005.0,"w":90,"h":60,"desc":"Cada pedido incluído entra como volume vendido contra o volume comprado (lotes), por produto. A Uralchem já tem uma view que cruza pedido de compra (data de desembarque) com pedido de venda (data de entrega), com a regra de não vender mais de 100 t além do comprado; compras usa, o comercial não enxerga. Deixa de ser requisito novo: é integrar essa view.","src":["Descrito pelo Carlos em 05/10/2026","Reunião na Uralchem (transcrição e quadro), analisada em 07/10/2026"],"dev":false,"todo":false},{"id":"s11","seq":11,"name":"Exposição cambial diária","label":"Exposição cambial diária","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":1375.0,"y":1005.0,"w":90,"h":60,"desc":"A venda entra na exposição cambial pela moeda informada. A apuração é diária.","src":["Descrito pelo Carlos em 05/10/2026"],"dev":true,"todo":false},{"id":"s12","seq":12,"name":"Liberação de crédito (financeiro)","label":"Liberação de crédito (financeiro)","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Financeiro","x":1510.0,"y":210.0,"w":90,"h":60,"desc":"O pedido de venda nasce bloqueado por crédito e é liberado pelo financeiro, no padrão Protheus. A liberação de estoque não acontece aqui: no costado o produto só existe depois do apontamento.","src":["Descrito pelo Carlos em 05/10/2026","Reunião na Uralchem (transcrição e quadro), analisada em 07/10/2026"],"dev":false,"todo":false},{"id":"s13","seq":13,"name":"Crédito liberado?","label":"Crédito liberado?","kind":"gw","pool":"totvs","poolName":"Totvs","lane":"Financeiro","x":1670.0,"y":220.0,"w":40,"h":40,"desc":"Sem crédito liberado o pedido não segue para a operação.","src":["Proposta deste desenho, a validar"],"dev":false,"todo":false},{"id":"s14","seq":14,"name":"Recebimento antecipado (RA)","label":"Recebimento antecipado (RA)","kind":"sub","pool":"totvs","poolName":"Totvs","lane":"Financeiro","x":1645.0,"y":310.0,"w":90,"h":60,"desc":"Rotina RA × Pedido: recebimento antecipado vinculado ao pedido.","src":["Material de rotinas do Fertilizer, pág. 60–61","Proposta deste desenho, a validar (encaixe neste ponto)"],"dev":false,"todo":false},{"id":"s15","seq":15,"name":"Compensação automática do RA","label":"Compensação automática do RA","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Financeiro","x":1510.0,"y":310.0,"w":90,"h":60,"desc":"Pendência incluída pelo Carlos em 07/10/2026: o RA deve ser compensado automaticamente contra o pedido (e o título), liberando o crédito sem intervenção manual. Regra, momento e tratamento de saldo parcial ainda a definir.","src":["Definido pelo Carlos em 07/10/2026"],"dev":true,"todo":true},{"id":"s16","seq":16,"name":"Chegada e descarga do navio","label":"Chegada e descarga do navio","kind":"task","pool":"mic","poolName":"Mic Sistemas","lane":"","x":1780.0,"y":1410.0,"w":90,"h":60,"desc":"A mercadoria sai diretamente do navio para o cliente: chega ao porto e é descarregada no costado. A entrada dessa mercadoria no estoque (NF totalizadora e integração da nota de entrada) é processo de entrada e fica fora deste fluxo.","src":["Descrito pelo Carlos em 05/10/2026"],"dev":false,"todo":false},{"id":"s17","seq":17,"name":"Ordem de carregamento","label":"Ordem de carregamento","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Carga e integração","x":1915.0,"y":1225.0,"w":90,"h":60,"desc":"Cada saída é registrada com uma ordem de carregamento.","src":["Descrito pelo Carlos em 05/10/2026","Material de rotinas do Fertilizer, pág. 48 e 59"],"dev":false,"todo":false},{"id":"s18","seq":18,"name":"Ordem de produção","label":"Ordem de produção","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Estoque e produção","x":2050.0,"y":435.0,"w":90,"h":60,"desc":"Ordem de produção vinculada ao carregamento. Vem antes da importação da nota de saída da MIC.","src":["Descrito pelo Carlos em 05/10/2026"],"dev":false,"todo":false},{"id":"s19","seq":19,"name":"Apontamento (gera estoque de PA)","label":"Apontamento (gera estoque de PA)","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Estoque e produção","x":2185.0,"y":435.0,"w":90,"h":60,"desc":"O apontamento da produção gera o estoque de produto acabado (PA) que a nota de venda consome. Também vem antes da importação da nota de saída.","src":["Descrito pelo Carlos em 05/10/2026"],"dev":false,"todo":false},{"id":"s20","seq":20,"name":"Liberação de estoque do pedido","label":"Liberação de estoque do pedido","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Estoque e produção","x":2320.0,"y":435.0,"w":90,"h":60,"desc el":"","pts":[[2140.0,465.0],[2185.0,465.0]],"cross":false,"inf":false,"id":"e20"},{"f":"s19","t":"s20","label":"","pts":[[2275.0,465.0],[2320.0,465.0]],"cross":false,"inf":false,"id":"e21"},{"f":"s20","t":"s21","label":"","pts":[[2410.0,465.0],[2432.5,465.0],[2432.5,1255.0],[2455.0,1255.0]],"cross":true,"inf":false,"id":"e22"},{"f":"s21","t":"s22","label":"","pts":[[2545.0,1255.0],[2615.0,1255.0]],"cross":false,"inf":false,"id":"e23"},{"f":"s22","t":"s23","label":"Sim","pts":[[2655.0,1255.0],[2725.0,1255.0]],"cross":false,"inf":false,"id":"e24"},{"f":"s22","t":"s24","label":"Não","pts":[[2635.0,1235.0],[2635.0,465.0],[2860.0,465.0]],"cross":true,"inf":false,"id":"e25"},{"f":"s23","t":"s24","label":"","pts":[[2815.0,1255.0],[2837.5,1255.0],[2837.5,465.0],[2860.0,465.0]],"cross":true,"inf":false,"id":"e26"},{"f":"s24","t":"s25","label":"","pts":[[2905.0,435.0],[2905.0,270.0]],"cross":false,"inf":false,"id":"e27"},{"f":"s25","t":"s26","label":"","pts":[[2950.0,240.0],[2972.5,240.0],[2972.5,725.0],[2995.0,725.0]],"cross":false,"inf":false,"id":"e28"},{"f":"s26","t":"s27","label":"","pts":[[3085.0,725.0],[3107.5,725.0],[3107.5,595.0],[3130.0,595.0]],"cross":false,"inf":false,"id":"e29"},{"f":"s27","t":"s28","label":"","pts":[[3220.0,595.0],[3242.5,595.0],[3242.5,1035.0],[3265.0,1035.0]],"cross":true,"inf":false,"id":"e30"},{"f":"s28","t":"s29","label":"","pts":[[3355.0,1035.0],[3430.0,1035.0]],"cross":false,"inf":false,"id":"e31"}],"findings":[{"sev":"alta","title":"Formação de preço e custo de referência da margem","text":"A validação de margem calcula margem sobre o preço do contrato contra um custo. Ainda não está definido como o preço será formado (tabela, custo mais margem, cotação do dia, moeda) nem qual custo de referência valida a margem desse preço (custo do lote vinculado, custo de reposição, custo do navio, custo apontado). Sem essas duas definições a etapa não tem regra e foi marcada como gap.","ask":"Definir a formação de preço e o custo de referência correspondente; depois, especificar o cálculo da margem e quem aprova desvios.","nodes":["s2","s6","s7"]},{"sev":"media","title":"Compensação automática do RA","text":"Hoje o desenho só diz que o RA vinculado ao pedido libera o crédito. A pendência incluída em 07/10/2026 é a compensação automática: o RA deve ser baixado contra o pedido e o título sem intervenção manual. Falta a regra para saldo parcial (libera proporcional ou exige o total), RA em moeda diferente da venda e RA maior que o pedido.","ask":"Definir a regra de compensação (total ou parcial), o momento (no RA ou no faturamento) e se a rotina padrão RA × Pedido do Fertilizer cobre isso ou é desenvolvimento.","nodes":["s13","s14","s15"]},{"sev":"media","title":"Venda por conta e ordem (entrega em outro lugar)","text":"Cenário complementar incluído em 07/10/2026: o cliente compra e a entrega é feita a um terceiro. O contrato de venda precisa identificar a operação e o destinatário, e no fim do fluxo sai uma NF de remessa por conta e ordem além da NF de venda. Falta definir os campos do contrato (destinatário, endereço de entrega, vínculo com o pedido), a operação fiscal de cada nota (venda à ordem e remessa por conta e ordem, a confirmar com o fiscal) e se a remessa vem da MIC junto com a nota de venda ou é emitida pelo LT Fácil. A remessa não gera título nem baixa de estoque adicional; o pós-nota segue pela nota de venda.","ask":"Definir os campos do contrato, as operações fiscais e quem emite a remessa; confirmar se a exposição e o lote tratam a venda à ordem como venda comum.","nodes":["s2","s22","s23"]},{"sev":"alta","title":"O que conta como lote disponível no FIFO","text":"No costado a venda é fechada antes de a mercadoria entrar fisicamente no estoque. Antes disso os lotes existem apenas como estoque em trânsito (armazéns 81, 82 e 83 do fluxo de importação). Se o FIFO olhar só o estoque físico, a venda no costado nunca encontra lote. Na venda fábrica o material já está no armazém da fábrica e o problema não existe.","ask":"Antes disso, decidir se a venda agrega lote (etapa marcada como pendente em 07/10/2026). Se agregar, definir se o lote em trânsito entra na fila do FIFO e qual data ordena a fila (invoice, DI ou entrada física).","nodes":["s3","s4"]},{"sev":"alta","title":"Venda sem lote: bloquear ou aceitar a descoberto","text":"O desenho propõe aceitar a venda sem lote e mostrá-la como vendida sem cobertura, porque é essa posição que a análise comprado × vendido precisa enxergar. Como o lote agora vem antes da margem, a venda sem lote também fica sem o custo do lote para validar a margem.","ask":"Escolher a regra. Se aceitar, definir qual custo valida a margem (custo de reposição?) e como o lote é vinculado depois.","nodes":["s4","s5","s6"]},{"sev":"alta","title":"Liberação de estoque mudou de lugar","text":"A reunião separou as duas liberações: o pedido nasce bloqueado por crédito e é liberado pelo financeiro; o estoque só existe depois do apontamento, então a liberação de estoque foi desenhada após ele (posição inferida, o costado não foi discutido). Enquanto isso o pedido fica com o bloqueio de estoque aberto no Protheus.","ask":"Confirmar que o Protheus fica com o bloqueio de estoque aberto até o apontamento e o que acontece se a quantidade apontada for menor que a do pedido.","nodes":["s12","s13","s20"]},{"sev":"alta","title":"A venda só entra na exposição quando o pedido é incluído","text":"Entre a venda fechada e a inclusão do pedido, a posição comprado × vendido e a exposição cambial ficam erradas. Como a apuração cambial é diária, um pedido incluído no dia seguinte já distorce o número. O contrato de pré-venda aprovado existe antes do pedido e já traz produto, quantidade, lote, moeda e PTAX.","ask":"Decidir se a exposição passa a contar a partir do contrato aprovado, e não do pedido.","nodes":["s8","s10","s11"]},{"sev":"media","title":"Lote vinculado ao contrato, antes do pedido","text":"Com o lote antes da validação de margem, o vínculo passa a acontecer na pré-venda, e o pedido herda o lote. Entre o contrato e o pedido o lote fica comprometido sem que exista pedido.","ask":"Confirmar que o lote é reservado no contrato e o que libera a reserva se o contrato for rejeitado.","nodes":["s3","s9","s8"]},{"sev":"media","title":"Entrada da mercadoria do costado está fora deste fluxo","text":"A NF totalizadora e a integração da nota de entrada são processo de entrada, então saíram do fluxo de vendas. A ordem de produção consome a mercadoria que entrou, portanto a venda depende dessa entrada. O fluxo de Importação deste painel mostra NF Filha e remessas 3949, sem uma etapa chamada NF totalizadora.","ask":"Confirmar se o fluxo de Importação já cobre a entrada do costado ou se falta desenhar esse ramo.","nodes":["s16","s18"]},{"sev":"media","title":"Exposição comprado × vendido e cambial não constam no material de rotinas","text":"Lote FIFO na venda e exposição cambial diária não aparecem entre as rotinas apresentadas. A posição comprado × vendido já existe na Uralchem como view fora do ERP (pedido de compra × pedido de venda, por data), então passa de requisito novo a integração; a exposição cambial não foi citada na reunião e continua sem dono e sem fonte. Cinco etapas seguem marcadas como requisito novo.","ask":"Definir se a view existente é a fonte da posição (e alimenta a verificação da pré-ordem) e especificar a exposição cambial: o que abre e encerra cada posição, fonte e data da PTAX, horário do corte diário.","nodes":["s3","s10","s11","s28"]},{"sev":"media","title":"Lote da venda × nota importada da MIC","text":"A NF de venda chega pronta da MIC e sua importação substitui a emissão no Protheus. O peso faturado vem da balança e pode diferir da quantidade do pedido, e a nota não conhece o lote FIFO vinculado.","ask":"Definir como a baixa escolhe o lote e o que fazer com a diferença de quantidade (saldo do pedido, novo lote, ajuste).","nodes":["s21","s24"]},{"sev":"media","title":"Importação da NF-e de saída da MIC: o que já existe","text":"O material mostra a rotina Importa NF-e 3949 (pág. 11–13), que traz notas de entrada da MIC. A importação da NF-e de venda, que substitui a emissão no Protheus, não aparece no material.","ask":"Confirmar com o Jose Luiz se essa importação já existe ou se é desenvolvimento.","nodes":["s21"]},{"sev":"media","title":"Moeda da venda até o título","text":"A pré-venda já tem os campos Moeda e PTAX (pág. 37). Para a exposição cambial funcionar, a moeda precisa ser obrigatória e seguir para o pedido e para o título a receber.","ask":"Definir a regra para venda em dólar faturada em reais: PTAX de qual data converte e quando a exposição é baixada.","nodes":["s2","s25"]},{"sev":"baixa","title":"Ordem de carregamento, produção e apontamento","text":"Ordem de produção e apontamento vêm antes da importação da nota de saída. A posição da ordem de carregamento, logo depois da descarga, e a da liberação de estoque, depois do apontamento, foram inferidas.","ask":"Confirmar a sequência, se é uma ordem de produção por carregamento e se o apontamento é automático.","nodes":["s17","s18","s19","s20"]},{"sev":"baixa","title":"Etapas depois da nota foram inferidas","text":"As etapas depois da nota (baixa de estoque, título, contabilização, livros fiscais) foram inferidas do padrão do ERP e são as mesmas nas duas operações de venda.","ask":"Validar o pós-nota.","nodes":["s24","s27"]}],"bounds":[40,40,3640,1510],"findTitle":"Pontos a definir","findLead":"Decisões que o desenho deixou em aberto. Cada uma muda o comportamento do fluxo, então vale fechar com o Jose Luiz e com quem opera antes de especificar o desenvolvimento.","numNote":"A numeração segue a ordem do fluxo e serve só como identificador de cada etapa neste painel.","foot":"<b>Fonte:<\/b> descrição e correções do Carlos em 05/10/2026 (requisitos do pedido, lote FIFO, exposição e as operações de venda), reunião na Uralchem analisada em 07/10/2026 (liberação de crédito separada da de estoque) e “apresentacao_rotinas.pdf” (ERP Protheus, Módulo Fertilizantes, LT Serviços de Informática, 83 páginas, out/2024). Não existe diagrama de origem: posições e traçado foram desenhados para este painel. A ficha de cada etapa informa de onde ela veio. No costado a mercadoria sai diretamente do navio para o cliente. O tronco comum (pré-venda, lote FIFO, margem, aprovação, pedido, exposição, liberação de crédito e compensação do RA), o cenário complementar de venda por conta e ordem e o pós-nota são os mesmos nas duas operações de venda. 29 elementos e 31 conexões.","findTab":"Pontos a definir","findTabXs":"A definir","findOne":"Ponto a definir"},{"key":"venda-fabrica","name":"Venda Fábrica","title":"Venda Fábrica","badge":"Versão 3 · rascunho","pools":[{"key":"totvs","name":"Totvs","x":40,"y":40,"w":4330,"h":750},{"key":"lt","name":"LT Fácil","x":40,"y":840,"w":4330,"h":720}],"lanes":[{"name":"Comercial","pool":"totvs","x":90,"y":40,"w":4280,"h":130},{"name":"Financeiro","pool":"totvs","x":90,"y":170,"w":4280,"h":230},{"name":"Estoque e produção","pool":"totvs","x":90,"y":400,"w":4280,"h":130},{"name":"Fiscal","pool":"totvs","x":90,"y":530,"w":4280,"h":130},{"name":"Contábil","pool":"totvs","x":90,"y":660,"w":4280,"h":130},{"name":"Painel de Vendas","pool":"lt","x":90,"y":840,"w":4280,"h":130},{"name":"Lotes e exposição","pool":"lt","x":90,"y":970,"w":4280,"h":220},{"name":"Carga e integração","pool":"lt","x":90,"y":1190,"w":4280,"h":220},{"name":"Atalhos Protheus","pool":"lt","x":90,"y":1410,"w":4280,"h":150,"hl":true,"note":"Rotinas padrão do Protheus que o usuário acessa por atalho dentro do Fertilizantes"}],"nodes":[{"id":"s1","seq":1,"name":"Negociação da venda","label":"Negociação da venda","kind":"start","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":190.0,"y":890.0,"w":30,"h":30,"desc":"O executivo comercial negocia a venda com o cliente.","src":["Descrito pelo Carlos em 05/10/2026"],"dev":false,"todo":false},{"id":"s2","seq":2,"name":"Pré-venda (contrato)","label":"Pré-venda (contrato)","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":295.0,"y":875.0,"w":90,"h":60,"desc":"Registro da negociação: cliente, produto, quantidade, preço, regra de saída, frete, vencimento, moeda e PTAX. A moeda precisa ser obrigatória, porque alimenta a exposição cambial diária. Complemento de 07/10/2026: o contrato precisa identificar se a venda é por conta e ordem (o cliente compra e a entrega é em outro lugar), com o destinatário da remessa, porque isso define a nota adicional no fim do fluxo.","src":["Material de rotinas do Fertilizer, pág. 35–37","Descrito pelo Carlos em 05/10/2026 (moeda)","Definido pelo Carlos em 07/10/2026 (conta e ordem)"],"dev":false,"todo":false},{"id":"s3","seq":3,"name":"Agrega lote disponível (FIFO)","label":"Agrega lote disponível (FIFO)","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":430.0,"y":1005.0,"w":90,"h":60,"desc":"O Fertilizer vincula à venda o lote mais antigo com saldo disponível do material, antes da validação de margem. O controle de estoque é FIFO e o pedido herda esse lote. Em 07/10/2026 o Carlos colocou esta etapa como ponto a definir: a reunião mostrou que o lote de entrada some na OP e o físico mistura navios, então ainda não está decidido se a venda agrega lote, com que finalidade (reserva de exposição e custo, ou rastreio) e em que momento.","src":["Descrito pelo Carlos em 05/10/2026","Definido pelo Carlos em 07/10/2026"],"dev":true,"todo":true},{"id":"s4","seq":4,"name":"Há lote com saldo?","label":"Há lote com saldo?","kind":"gw","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":590.0,"y":1015.0,"w":40,"h":40,"desc":"Verifica se existe lote com saldo para cobrir a quantidade vendida. Depende da definição da etapa anterior.","src":["Proposta deste desenho, a validar"],"dev":true,"todo":true},{"id":"s5","seq":5,"name":"Venda sem lote (a descoberto)","label":"Venda sem lote (a descoberto)","kind":"task","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":700.0,"y":1105.0,"w":90,"h":60,"desc":"Sem lote disponível, a venda segue sem vínculo e aparece na posição como vendida sem cobertura, até existir lote. Depende da definição de \"Agrega lote\".","src":["Proposta deste desenho, a validar"],"dev":true,"todo":true},{"id":"s6","seq":6,"name":"Validação de margem","label":"Validação de margem","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":835.0,"y":875.0,"w":90,"h":60,"desc":"Calcula a margem do contrato (venda e custo total em USD, frete, PTAX) e envia aos aprovadores. Em 07/10/2026 o Carlos marcou esta etapa como gap: ainda não está definido como o preço será formado nem qual custo de referência valida a margem desse preço. Até lá a etapa fica pendente.","src":["Material de rotinas do Fertilizer, pág. 26","Descrito pelo Carlos em 05/10/2026 (depois do lote)","Definido pelo Carlos em 07/10/2026"],"dev":false,"todo":true},{"id":"s7","seq":7,"name":"Contrato aprovado?","label":"Contrato aprovado?","kind":"gw","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":995.0,"y":885.0,"w":40,"h":40,"desc":"Aprovação do contrato e do frete pelos aprovadores, na aba Contratos Pendentes. A reunião confirmou que a pré-venda concentra os bloqueios comerciais e jurídicos (contrato assinado, condição de pagamento): o pedido de venda só nasce depois dela.","src":["Material de rotinas do Fertilizer, pág. 21 e 24","Reunião na Uralchem (transcrição e quadro), analisada em 07/10/2026"],"dev":false,"todo":false},{"id":"s8","seq":8,"name":"Pedido de venda","label":"Pedido de venda","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Comercial","x":1105.0,"y":75.0,"w":90,"h":60,"desc":"O executivo comercial inclui o pedido de venda a partir do contrato aprovado, com o lote já vinculado. É a inclusão do pedido que coloca a venda nas análises de exposição, então ela precisa acontecer no ato da venda.","src":["Descrito pelo Carlos em 05/10/2026","Material de rotinas do Fertilizer, pág. 22"],"dev":false,"todo":false},{"id":"s9","seq":9,"name":"Venda não efetivada","label":"Venda não efetivada","kind":"end","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":1135.0,"y":890.0,"w":30,"h":30,"desc":"Contrato rejeitado. Não gera pedido nem entra na posição vendida.","src":["Proposta deste desenho, a validar"],"dev":false,"todo":false},{"id":"s10","seq":10,"name":"Posição comprado × vendido","label":"Posição comprado × vendido","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":1240.0,"y":1005.0,"w":90,"h":60,"desc":"Cada pedido incluído entra como volume vendido contra o volume comprado (lotes), por produto. A Uralchem já tem uma view que cruza pedido de compra (data de desembarque) com pedido de venda (data de entrega), com a regra de não vender mais de 100 t além do comprado; compras usa, o comercial não enxerga. Deixa de ser requisito novo: é integrar essa view.","src":["Descrito pelo Carlos em 05/10/2026","Reunião na Uralchem (transcrição e quadro), analisada em 07/10/2026"],"dev":false,"todo":false},{"id":"s11","seq":11,"name":"Exposição cambial diária","label":"Exposição cambial diária","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":1375.0,"y":1005.0,"w":90,"h":60,"desc":"A venda entra na exposição cambial pela moeda informada. A apuração é diária.","src":["Descrito pelo Carlos em 05/10/2026"],"dev":true,"todo":false},{"id":"s12","seq":12,"name":"Liberação de crédito (financeiro)","label":"Liberação de crédito (financeiro)","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Financeiro","x":1510.0,"y":210.0,"w":90,"h":60,"desc":"O pedido de venda nasce bloqueado por crédito e é liberado pelo financeiro, no padrão Protheus. A liberação de estoque não acontece aqui: na fábrica nunca há produto acabado em estoque, então ela fica para o fechamento da pré-ordem.","src":["Descrito pelo Carlos em 05/10/2026","Reunião na Uralchem (transcrição e quadro), analisada em 07/10/2026"],"dev":false,"todo":false},{"id":"s13","seq":13,"name":"Crédito liberado?","label":"Crédito liberado?","kind":"gw","pool":"totvs","poolName":"Totvs","lane":"Financeiro","x":1670.0,"y":220.0,"w":40,"h":40,"desc":"Sem crédito liberado o pedido não segue para a operação.","src":["Proposta deste desenho, a validar"],"dev":false,"todo":false},{"id":"s14","seq":14,"name":"Recebimento antecipado (RA)","label":"Recebimento antecipado (RA)","kind":"sub","pool":"totvs","poolName":"Totvs","lane":"Financeiro","x":1645.0,"y":310.0,"w":90,"h":60,"desc":"Rotina RA × Pedido: recebimento antecipado vinculado ao pedido.","src":["Material de rotinas do Fertilizer, pág. 60–61","Proposta deste desenho, a validar (encaixe neste ponto)"],"dev":false,"todo":false},{"id":"s15","seq":15,"name":"Compensação automática do RA","label":"Compensação automática do RA","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Financeiro","x":1510.0,"y":310.0,"w":90,"h":60,"desc":"Pendência incluída pelo Carlos em 07/10/2026: o RA deve ser compensado automaticamente contra o pedido (e o título), liberando o crédito sem intervenção manual. Regra, momento e tratamento de saldo parcial ainda a definir.","src":["Definido pelo Carlos em 07/10/2026"],"dev":true,"todo":true},{"id":"s16","seq":16,"name":"Agendamento pela transportadora","label":"Agendamento pela transportadora","kind":"task","pool":"lt","poolName":"LT Fácil","lane":"Carga e integração","x":1780.0,"y":1225.0,"w":90,"h":60,"desc":"Com o crédito liberado, o comercial alimenta a plataforma de liberação e os pedidos vão ao portal da transportadora, que combina a entrega com o cliente e agenda o caminhão na portaria. Hoje é planilha e portal paralelos.","src":["Reunião na Uralchem (transcrição e quadro), analisada em 07/10/2026"],"dev":false,"todo":false},{"id":"s17","seq":17,"name":"Pré-ordem de carregamento","label":"Pré-ordem de carregamento","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Carga e integração","x":1915.0,"y":1225.0,"w":90,"h":60,"desc":"Pré-ordem criada no LT Fácil a partir do pedido liberado e do agendamento. Dispara a verificação automática de disponibilidade.","src":["Descrito pelo Carlos em 05/10/2026","Material de rotinas do Fertilizer, pág. 59","Reunião na Uralchem (transcrição e quadro), analisada em 07/10/2026"],"dev":false,"todo":false},{"id":"s18","seq":18,"name":"Verificação automática de disponibilidade (view de exposição)","label":"Verificação automática de disponibilidade (view de exposição)","kind":"gw","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":2075.0,"y":1015.0,"w":40,"h":40,"desc":"Automação da LT: ao criar a pré-ordem, consulta a view de exposição da Uralchem (pedido de compra × pedido de venda, por data) e verifica se haverá MP para a OP. Para isso explode a fórmula do produto vendido, confronta com o saldo físico de cada MP e com as entradas em trânsito, descontando o que já está reservado por outras pré-ordens aprovadas e ainda não apontadas, e mostra a data prevista para apontar. A automação calcula e dá o parecer; a aprovação da pré-ordem continua sendo ato humano. Não libera o estoque do pedido: isso acontece no fechamento da pré-ordem.","src":["Definido pelo Carlos em 07/10/2026","Reunião na Uralchem (transcrição e quadro), analisada em 07/10/2026"],"dev":true,"todo":false},{"id":"s19","seq":19,"name":"Pré-ordem retida (aguarda MP)","label":"Pré-ordem retida (aguarda MP)","kind":"task","pool":"lt","poolName":"LT Fácil","lane":"Lotes e exposição","x":2050.0,"y":1105.0,"w":90,"h":60,"desc":"Pré-ordem sem parecer favorável (ou não aprovada) fica imputada mas não liberada. Volta para a verificação quando a MP chega ou a entrada em trânsito é confirmada. Evita OP sem saldo e caminhão esperando na portaria.","src":["Reunião na Uralchem (transcrição e quadro), analisada em 07/10/2026"],"dev":true,"todo":false},{"id":"s20","seq":20,"name":"Ordem de produção","label":"Ordem de produção","kind":"task","pool":"lt","poolN  faturamento do Protheus (definido pelo Carlos em 07/10/2026). Pedido da operação: espelho do DANFE antes da transmissão, para validar placa e dados. A rotina gera a nota sem transmitir.","src":["Reunião na Uralchem (transcrição e quadro), analisada em 07/10/2026","Definido pelo Carlos em 07/10/2026"],"dev":false,"todo":false},{"id":"s29","seq":29,"name":"Gera NF de saída","label":"Gera NF de saída","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Atalhos Protheus","x":3265.0,"y":1460.0,"w":90,"h":60,"desc":"Rotina padrão de faturamento do Protheus acessada por atalho dentro do Fertilizantes (definido pelo Carlos em 07/10/2026): gera a NF de venda a partir do fechamento da pré-ordem e do peso validado, transmite após o espelho conferido e grava a nota no Protheus, que segue com o pós-nota. No costado a nota vem importada da MIC.","src":["Descrito pelo Carlos em 05/10/2026","Definido pelo Carlos em 07/10/2026"],"dev":false,"todo":false},{"id":"s30","seq":30,"name":"Venda por conta e ordem?","label":"Venda por conta e ordem?","kind":"gw","pool":"lt","poolName":"LT Fácil","lane":"Carga e integração","x":3425.0,"y":1235.0,"w":40,"h":40,"desc":"Cenário complementar descrito pelo Carlos em 07/10/2026: o cliente compra e a entrega é em outro lugar. A decisão lê a identificação feita no contrato de venda.","src":["Definido pelo Carlos em 07/10/2026"],"dev":false,"todo":false},{"id":"s31","seq":31,"name":"NF de remessa por conta e ordem","label":"NF de remessa por conta e ordem","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Carga e integração","x":3535.0,"y":1225.0,"w":90,"h":60,"desc":"Além da NF de venda ao cliente, emite-se a NF de remessa por conta e ordem para o destinatário da entrega, com os dados da venda à ordem. Proposta: emitida pela mesma rotina da LT que gera a NF de saída, logo depois dela.","src":["Definido pelo Carlos em 07/10/2026","Proposta deste desenho, a validar"],"dev":true,"todo":true},{"id":"s32","seq":32,"name":"Baixa do estoque de PA :false,"id":"e34"},{"f":"s30","t":"s32","label":"Não","pts":[[3445.0,1235.0],[3445.0,465.0],[3670.0,465.0]],"cross":true,"inf":false,"id":"e35"},{"f":"s31","t":"s32","label":"","pts":[[3625.0,1255.0],[3647.5,1255.0],[3647.5,465.0],[3670.0,465.0]],"cross":true,"inf":false,"id":"e36"},{"f":"s32","t":"s33","label":"","pts":[[3715.0,435.0],[3715.0,270.0]],"cross":false,"inf":false,"id":"e37"},{"f":"s33","t":"s34","label":"","pts":[[3760.0,240.0],[3782.5,240.0],[3782.5,725.0],[3805.0,725.0]],"cross":false,"inf":false,"id":"e38"},{"f":"s34","t":"s35","label":"","pts":[[3895.0,725.0],[3917.5,725.0],[3917.5,595.0],[3940.0,595.0]],"cross":false,"inf":false,"id":"e39"},{"f":"s35","t":"s36","label":"","pts":[[4030.0,595.0],[4052.5,595.0],[4052.5,1035.0],[4075.0,1035.0]],"cross":true,"inf":false,"id":"e40"},{"f":"s36","t":"s37","label":"","pts":[[4165.0,1035.0],[4240.0,1035.0]],"cross":false,"inf":false,"id":"e41"}],"findings":[{"sev":"alta","title":"Formação de preço e custo de referência da margem","text":"A validação de margem calcula margem sobre o preço do contrato contra um custo. Ainda não está definido como o preço será formado (tabela, custo mais margem, cotação do dia, moeda) nem qual custo de referência valida a margem desse preço (custo do lote vinculado, custo de reposição, custo do navio, custo apontado). Sem essas duas definições a etapa não tem regra e foi marcada como gap.","ask":"Definir a formação de preço e o custo de referência correspondente; depois, especificar o cálculo da margem e quem aprova desvios.","nodes":["s2","s6","s7"]},{"sev":"media","title":"Compensação automática do RA","text":"Hoje o desenho só diz que o RA vinculado ao pedido libera o crédito. A pendência incluída em 07/10/2026 é a compensação automática: o RA deve ser baixado contra o pedido e o título sem intervenção manual. Falta a regra para saldo parcial (libera proporcional ou exige o total), RA em moeda diferente da venda e RA maior que o pedido.","ask":"Definir a regra de compensação (total ou parcial), o momento (no RA ou no faturamento) e se a rotina padrão RA × Pedido do Fertilizer cobre isso ou é desenvolvimento.","nodes":["s13","s14","s15"]},{"sev":"media","title":"Venda por conta e ordem (entrega em outro lugar)","text":"Cenário complementar incluído em 07/10/2026: o cliente compra e a entrega é feita a um terceiro. O contrato de venda precisa identificar a operação e o destinatário, e no fim do fluxo sai uma NF de remessa por conta e ordem além da NF de venda. Falta definir os campos do contrato (destinatário, endereço de entrega, vínculo com o pedido), a operação fiscal de cada nota (venda à ordem e remessa por conta e ordem, a confirmar com o fiscal) e se a rotina da LT que gera a NF de saída emite a remessa em sequência. A remessa não gera título nem baixa de estoque adicional; o pós-nota segue pela nota de venda.","ask":"Definir os campos do contrato, as operações fiscais e quem emite a remessa; confirmar se a exposição e o lote tratam a venda à ordem como venda comum.","nodes":["s2","s30","s31"]},{"sev":"alta","title":"Venda sem lote: bloquear ou aceitar a descoberto","text":"O desenho propõe aceitar a venda sem lote e mostrá-la como vendida sem cobertura, porque é essa posição que a análise comprado × vendido precisa enxergar. Como o lote agora vem antes da margem, a venda sem lote também fica sem o custo do lote para validar a margem.","ask":"Escolher a regra. Se aceitar, definir qual custo valida a margem (custo de reposição?) e como o lote é vinculado depois.","nodes":["s4","s5","s6"]},{"sev":"alta","title":"Liberação de estoque mudou de lugar","text":"A reunião separou as duas liberações: o pedido nasce bloqueado por crédito e é liberado pelo financeiro; o estoque só é liberado no fechamento da pré-ordem, depois do apontamento, porque nunca há produto acabado em estoque. Enquanto isso o pedido fica com o bloqueio de estoque aberto no Protheus, e a transportadora pode agendar um pedido ainda bloqueado.","ask":"Confirmar que o Protheus fica com o bloqueio de estoque aberto até o fechamento da pré-ordem e se o portal da transportadora enxerga só pedidos com crédito liberado.","nodes":["s12","s13","s23"]},{"sev":"alta","title":"A venda só entra na exposição quando o pedido é incluído","text":"Entre a venda fechada e a inclusão do pedido, a posição comprado × vendido e a exposição cambial ficam erradas. Como a apuração cambial é diária, um pedido incluído no dia seguinte já distorce o número. O contrato de pré-venda aprovado existe antes do pedido e já traz produto, quantidade, lote, moeda e PTAX.","ask":"Decidir se a exposição passa a contar a partir do contrato aprovado, e não do pedido.","nodes":["s8","s10","s11"]},{"sev":"media","title":"Lote vinculado ao contrato, antes do pedido","text":"Com o lote antes da validação de margem, o vínculo passa a acontecer na pré-venda, e o pedido herda o lote. Entre o contrato e o pedido o lote fica comprometido sem que exista pedido.","ask":"Confirmar que o lote é reservado no contrato e o que libera a reserva se o contrato for rejeitado.","nodes":["s3","s9","s8"]},{"sev":"media","title":"Exposição comprado × vendido e cambial não constam no material de rotinas","text":"Lote FIFO na venda e exposição cambial diária não aparecem entre as rotinas apresentadas. A posição comprado × vendido já existe na Uralchem como view fora do ERP (pedido de compra × pedido de venda, por data), então passa de requisito novo a integração; a exposição cambial não foi citada na reunião e continua sem dono e sem fonte. Sete etapas seguem marcadas como requisito novo.","ask":"Definir se a view existente é a fonte da posição (e alimenta a verificação da pré-ordem) e especificar a exposição cambial: o que abre e encerra cada posição, fonte e data da PTAX, horário do corte diário.","nodes":["s3","s10","s11","s36"]},{"sev":"media","title":"Moeda da venda até o título","text":"A pré-venda já tem os campos Moeda e PTAX (pág. 37). Para a exposição cambial funcionar, a moeda precisa ser obrigatória e seguir para o pedido e para o título a receber.","ask":"Definir a regra para venda em dólar faturada em reais: PTAX de qual data converte e quando a exposição é baixada.","nodes":["s2","s33"]},{"sev":"alta","title":"Lote FIFO da venda é reserva, não rastreio físico","text":"O requisito de agregar lote à venda antes da margem supõe que o lote será consumido. A reunião mostrou que o lote de entrada some na OP, o sistema consome FIFO automático e o físico mistura navios. O lote vinculado à venda serve para exposição e custo projetado, não para rastrear o que saiu.","ask":"A etapa \"Agrega lote\" ficou como ponto a definir em 07/10/2026. Decidir se ela existe e com que finalidade: reserva (custo do navio que cobre a venda, com o custo real vindo do apontamento) ou nenhuma; e se a margem validada na pré-venda é refeita com o custo apontado.","nodes":["s3","s4","s5","s21","s22"]},{"sev":"alta","title":"Quem aprova a pré-ordem (o PCP que não existe)","text":"Definido em 07/10/2026: a LT cria uma automação que consulta a view de exposição e verifica se haverá MP para a OP; a automação calcula e dá o parecer, e a aprovação da pré-ordem continua humana. A view atual cruza volumes de compra e venda por data e não tem a fórmula do produto nem o saldo físico por MP, então a automação precisa acrescentar os dois e descontar as reservas de pré-ordens já aprovadas e não apontadas, senão duas pré-ordens no mesmo dia contam a mesma MP duas vezes. A view vive fora do ERP e o comercial não a enxerga.","ask":"Definir quem aprova a pré-ordem (nome e área), onde a view passa a rodar para ser consultada pela automação e a regra de reserva entre pré-ordens aprovadas.","nodes":["s17","s18","s19"]},{"sev":"media","title":"Agendamento da transportadora dentro do fluxo","text":"Hoje o agendamento é planilha e portal paralelo. A Mic oferece ordem de carregamento → portal → agendamento → autorização por flag.","ask":"Decidir se o portal da Mic substitui a plataforma atual e se o agendamento entra antes ou depois da aprovação da pré-ordem.","nodes":["s16","s17"]},{"sev":"media","title":"Tolerância de peso na saída e espelho do DANFE","text":"A nota só fecha com o peso dentro da regra; a repesagem pode ser na balança ou fora dela, sem novo ticket. Espelho do DANFE e geração da NF de saída ficaram no LT Fácil (definido em 07/10/2026): a rotina da LT gera a nota, mostra o espelho e só então transmite, gravando no Protheus. Nenhuma das duas rotinas aparece no material.","ask":"Definir a tolerância por produto, quem aprova o ajuste e confirmar com o Jose Luiz se espelho e geração da NF pela LT são desenvolvimento ou adaptação da rotina existente.","nodes":["s25","s26","s27","s28"]},{"sev":"media","title":"Fechamento da pré-ordem no lugar da ordem de carregamento","text":"No desenho anterior a ordem de carregamento vinha antes da OP. Na sequência acordada a OP, o empenho e o apontamento vêm primeiro e o fechamento da pré-ordem consome o apontamento, libera o estoque e prepara a nota. A OC do material (pág. 48 e 59) passa a ser esse fechamento.","ask":"Confirmar que a OC do Fertilizer é gerada no fechamento da pré-ordem e se a OP é gerada automaticamente na aprovação.","nodes":["s18","s20","s23"]},{"sev":"baixa","title":"Etapas depois da nota foram inferidas","text":"As etapas depois da nota (baixa de estoque, título, contabilização, livros fiscais) foram inferidas do padrão do ERP e são as mesmas nas duas operações de venda.","ask":"Validar o pós-nota.","nodes":["s32","s35"]}],"bounds":[40,40,4370,1560],"findTitle":"Pontos a definir","findLead":"Decisões que o desenho deixou em aberto. Cada uma muda o comportamento do fluxo, então vale fechar com o Jose Luiz e com quem opera antes de especificar o desenvolvimento.","numNote":"A numeração segue a ordem do fluxo e serve só como identificador de cada etapa neste painel.","foot":"<b>Fonte:<\/b> descrição e correções do Carlos em 05/10/2026 (requisitos do pedido, lote FIFO, exposição e as operações de venda), reunião na Uralchem analisada em 07/10/2026 (liberação de crédito separada da de estoque, agendamento, pré-ordem com verificação de disponibilidade, fechamento, pesagem e espelho do DANFE) e “apresentacao_rotinas.pdf” (ERP Protheus, Módulo Fertilizantes, LT Serviços de Informática, 83 páginas, out/2024). Não existe diagrama de origem: posições e traçado foram desenhados para este painel. A ficha de cada etapa informa de onde ela veio. Na venda fábrica o material está no armazém da fábrica. O tronco comum (pré-venda, lote FIFO, margem, aprovação, pedido, exposição, liberação de crédito e compensação do RA), o cenário complementar de venda por conta e ordem e o pós-nota são os mesmos nas duas operações de venda. 37 elementos e 41 conexões.","findTab":"Pontos a definir","findTabXs":"A definir","findOne":"Ponto a definir"},{"key":"comercial","name":"Comercial e Comissão","title":"Comercial, Faturamento e Comissão","badge":"Versão 1 · rascunho","pools":[{"key":"totvs","name":"Totvs","x":40,"y":40,"w":5830,"h":950},{"key":"lt","name":"LT Fácil","x":40,"y":1040,"w":5830,"h":350}],"lanes":[{"name":"Comercial e cadastros","pool":"totvs","x":90,"y":40,"w":5780,"h":130},{"name":"Financeiro","pool":"totvs","x":90,"y":170,"w":5780,"h":230},{"name":"Faturamento e fiscal","pool":"totvs","x":90,"y":400,"w":5780,"h":230},{"name":"Compras","pool":"totvs","x":90,"y":630,"w":5780,"h":230},{"name":"Contábil","pool":"totvs","x":90,"y":860,"w":5780,"h":130},{"name":"Painel de Vendas","pool":"lt","x":90,"y":1040,"w":5780,"h":220},{"name":"Carga e liberações","pool":"lt","x":90,"y":1260,"w":5780,"h":130}],"nodes":[{"id":"s1","seq":1,"name":"Demanda do cliente (WhatsApp, e-mail, Teams)","label":"Demanda do cliente (WhatsApp, e-mail, Teams)","kind":"start","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":190.0,"y":1090.0,"w":30,"h":30,"desc":"Os supervisores comerciais em campo recebem a demanda do cliente e encaminham para a equipe interna. No quadro: \"Whats / Email / Teams\".","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":false,"todo":false},{"id":"s2","seq":2,"name":"Cliente cadastrado?","label":"Cliente cadastrado?","kind":"gw","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":320.0,"y":1085.0,"w":40,"h":40,"desc":"Confere se o cliente já existe no Protheus antes de abrir a pré-venda.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026"],"dev":false,"todo":false},{"id":"s3","seq":3,"name":"Cadastro de cliente","label":"Cadastro de cliente","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Comercial e cadastros","x":430.0,"y":75.0,"w":90,"h":60,"desc":"Cadastro do cliente no Protheus (CRMA980). A comissão do representante é vinculada ao cliente.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":false,"todo":false},{"id":"s4","seq":4,"name":"Produto cadastrado?","label":"Produto cadastrado?","kind":"gw","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":590.0,"y":1085.0,"w":40,"h":40,"desc":"Confere se o produto (fórmula) já existe. Gap apontado: hoje há vários códigos para o mesmo produto, que diferem só pela embalagem.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":false,"todo":false},{"id":"s5","seq":5,"name":"Cadastro de produto","label":"Cadastro de produto","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Comercial e cadastros","x":700.0,"y":75.0,"w":90,"h":60,"desc":"Cadastro do produto no Protheus (MATA010). Proposta da reunião: a embalagem (granel ou big bag) passa a ser atributo da estrutura, e não um código diferente.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":false,"todo":false},{"id":"s6","seq":6,"name":"Verificar disponibilidade de MP (view)","label":"Verificar disponibilidade de MP (view)","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":835.0,"y":1075.0,"w":90,"h":60,"desc":"Gap: consulta (view) que mostra ao comercial a expectativa de estoque de matéria-prima em datas futuras, para não vender o que não terá insumo. É a mesma view que alimenta a verificação da pré-ordem na Venda Fábrica.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":true,"todo":false},{"id":"s7","seq":7,"name":"Tabela de preço semanal","label":"Tabela de preço semanal","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":970.0,"y":1075.0,"w":90,"h":60,"desc":"Gap: precificação por planilha semanal com custo das matérias-primas, cotação do dólar e composição da fórmula (ex.: MAP, nitrato, cloreto). O preço final soma embalagem (granel ou big bag), frete (CIF ou FOB) e comissão do representante. A margem é monitorada e pode ser autorizada semanalmente pela gestão, inclusive zero ou negativa em casos específicos.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":true,"todo":false},{"id":"s8","seq":8,"name":"Pré-venda (formulação e composição)","label":"Pré-venda (formulação e composição)","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":1105.0,"y":1075.0,"w":90,"h":60,"desc":"Cotação ou pré-lançamento no Fertilizantes. É onde se define a formulação e a composição do material, que a automação e o carregamento usam depois. O pedido é gerado a partir dela para evitar alterações no documento final.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":false,"todo":false},{"id":"s9","seq":9,"name":"Desconto acima de 10%?","label":"Desconto acima de 10%?","kind":"gw","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":1265.0,"y":1085.0,"w":40,"h":40,"desc":"Gatilho de aprovação comercial: desconto até 10% é aprovado automaticamente; acima disso exige o gestor.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":false,"todo":false},{"id":"s10","seq":10,"name":"Aprovação do gestor","label":"Aprovação do gestor","kind":"task","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":1375.0,"y":1175.0,"w":90,"h":60,"desc":"Gap: alçada de aprovação (de uma a três instâncias) para descontos acima de 10% e para a margem. Exemplo citado: Dr. Lelis.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":true,"todo":false},{"id":"s11","seq":11,"name":"Contrato de venda (layout jurídico)","label":"Contrato de venda (layout jurídico)","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":1510.0,"y":1075.0,"w":90,"h":60,"desc":"Gap: contrato gerado a partir da pré-venda aprovada, no layout padrão do jurídico, com frete, embalagem e responsável. Proposta da reunião: QR Code ou chave Pix no contrato para identificar o pagamento antecipado.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":true,"todo":false},{"id":"s12","seq":12,"name":"Imprime contrato e pré-venda","label":"Imprime contrato e pré-venda","kind":"task","pool":"lt","poolName":"LT Fácil","lane":"Painel de Vendas","x":1645.0,"y":1075.0,"w":90,"h":60,"desc":"Hoje a assinatura é manual: download do PDF e envio ao cliente. Intenção de integrar assinatura eletrônica (TOTVS Assinatura).","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":false,"todo":false},{"id":"s13","seq":13,"name":"Possui adiantamento?","label":"Possui adiantamento?","kind":"gw","pool":"totvs","poolName":"Totvs","lane":"Financeiro","x":1805.0,"y":220.0,"w":40,"h":40,"desc":"Pagamentos antecipados são co  de venda","label":"Pedido de venda","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Comercial e cadastros","x":2320.0,"y":75.0,"w":90,"h":60,"desc":"Pedido gerado a partir da pré-venda (MATA410), herdando a composição. A data prevista de entrega é crítica para produção e logística. Data e toneladas podem mudar enquanto houver saldo a entregar; depois da nota, não. A comissão do representante é definida aqui (padrão 1%, variando com o desconto).","src":["Quadro da reunião comercial na Uralchem, 08/10/2026","Resumo da reunião comercial na Uralchem, 08/10/2026"],"dev":false,"todo":false},{"id":"s19","seq":19,"name":"Possui adiantamento?","label":"Possui adiantamento?","kind":"gw","pool":"totvs","poolName":"Totvs","lane":"Comercial e cadastros","x":2480.0,"y":85.0,"w":40,"h":40,"desc":"Se houve RA antes do pedido, ele precisa ser vinculado.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026"],"dev":false,"todo":false},{"id":"s20","seq":20,"name":"Vincula adiantamento ao pedido","label":"Vincula adiantamento ao pedido","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Financeiro","x":2590.0,"y":210.0,"w":90,"h":60,"desc":"MATA410 › Outras ações › Adiantamento › Relacionar adiantamentos. A compensação na nota é automática no padrão.","src":["Quadro da reunião comercial na Uralchem, 08/10/2026"],"dev":false,"todo":false},{"id":"s21","seq":21,"name":"Liberação de crédito","label":"Liberação de crédito","kind":"task","pool":"totvs","poolName":"Totvs","lane":"Comercial e cadastros","x":2725.0,"y":75.0,"w":90,"h":60,"desc":"Validação de crédito no momento do pedido, principalmente para pagamento a prazo (MATA450). Mesma etapa da Venda Fábrica.","src":["Resumo da reunião comercial na Uralchem, 08/10/2026","Validado nas etapas da Venda Fábrica (07/10/2026)"],"dev":false,"todo":false},{"id":"s22","seq":22,"name":"Portal de Liberações","label":"Portal de Liberações","kind":"sub","pool":"lt","poolName":"LT Fácil","lane":"Carga e liberações","x":2860.0,"y":1
