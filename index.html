<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1024">
<title>Acompanhamento Fertilizer AVC — LT Fácil</title>
<link rel="stylesheet" href="styles.css?v=20261015d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A1024'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='900' font-size='14' text-anchor='middle' fill='%231ED69E'%3ELT%3C/text%3E%3C/svg%3E">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login" class="login-wrap">
  <form class="login" onsubmit="return app.login(event)">
    <div class="lbrand"><span class="logo-lt" role="img" aria-label="LT Sistemas"></span><div><small>Acompanhamento de projeto</small></div></div>
    <h1>Fertilizer AVC</h1>
    <p>Painel dos consultores. Entre com o e-mail e a senha fornecidos pela LT.</p>
    <label>E-mail</label><input id="l-email" type="email" autocomplete="username" required>
    <label>Senha</label><input id="l-pass" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Entrar</button>
    <div class="err" id="l-err"></div>
    <div id="l-setup" class="setup hidden">Configuração pendente: edite <b>config.js</b> com a URL e a chave do projeto Supabase (veja o README).</div>
  </form>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="hidden">
  <div class="backdrop" onclick="app.menu(false)"></div>
  <aside class="side">
    <div class="brand"><span class="logo-lt" role="img" aria-label="LT Sistemas"></span></div>
    <nav id="nav"></nav>
    <div class="sfoot">
      <div class="user"><div class="l1">Conectado como</div><b id="u-nome"></b><span id="u-papel"></span></div>
      <button class="btn ghost small" onclick="app.logout()">Sair</button>
      <button class="btn ghost small no-mobile" onclick="app.collapse()">◀ Recolher menu</button>
    </div>
  </aside>
  <div class="content">
    <header class="topbar">
      <button class="iconbtn" onclick="app.menu()" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="ttl">Fertilizer AVC<b id="view-title">Boletim</b></div>
      <div class="spacer"></div>
    </header>
    <main id="main"></main>
  </div>
  <div id="savebar" class="savebar hidden">
    <span id="dirty-count"></span>
    <button class="btn" onclick="app.saveAll()">Salvar alterações</button>
    <button class="btn ghost" onclick="app.discard()">Descartar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="app.js?v=20261015d"></script>
</body>
</html>
